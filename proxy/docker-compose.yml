# ★ 프로젝트 이름을 못 박는다.
#
#   docker compose 는 이름을 안 적으면 **폴더 이름**으로 프로젝트를 정한다.
#   그런데 이 저장소를 받은 사람이 같은 이름의 폴더로 다른 것을 이미
#   띄워 두었을 수 있다. 그러면 compose 가 남의 컨테이너를 이 프로젝트
#   것으로 보고, `docker compose exec` 가 **엉뚱한 컨테이너 안에서** 돈다.
#   실제로 그 상황을 겪었다 — 체험판 자료를 넣는 명령이 남의 앱 안에서
#   실행됐다. 그때는 파일이 없어서 실패로 끝났지만, 있었으면 남의 데이터에
#   가짜 자료가 들어갔을 것이다.
#
#   컨테이너 이름에 demo- 를 붙이는 것과는 다른 이야기다.
#   그건 이름이 겹치지 않게 하는 것이고, 이건 **누구 것인지**를 정하는 것이다.
name: demo-proxy

# =====================================================================
# 리버스 프록시 — 사내에서 들어오는 유일한 입구.
#
# 로컬과 서버가 **딱 한 가지**만 다르다. 어디에 포트를 열 것인가.
#
#   로컬(윈도우)   80 을 그대로 쓴다.            PROXY_PUBLISH=80:80
#   사내 서버      앞에 호스트 nginx 가 있다.    PROXY_PUBLISH=127.0.0.1:8081:80
#
# 서버에는 이미 nginx 가 깔려 있고 도메인·인증서까지 걸려 있다.
# 그러니 이 컨테이너가 80 을 가져가면 안 된다. 호스트 nginx 를 대문으로
# 두고 이 컨테이너는 그 뒤에 선다.
#
#   브라우저 → 호스트 nginx (443, 인증서)
#            → 127.0.0.1:8081        ← 이 컨테이너
#            → portal / aireport / asset-web  (demo-net 안에서 이름으로)
#
# 127.0.0.1 을 앞에 붙이는 것이 핵심이다. 이걸 빼면 8081 이 사내망 전체에
# 열려서, 호스트 nginx 의 인증서·접근 로그를 건너뛰는 뒷문이 생긴다.
#
# 앱 라우팅·권한 검사·헤더 주입은 전부 이 컨테이너 안에서 일어난다.
# 로컬에서 시험한 그대로다. 호스트 nginx 에는 "여기로 넘겨라" 한 줄만 있으면 된다.
#
# 이 값은 같은 폴더의 .env 에서 읽는다. 파일을 두 벌로 나누지 않는 이유가
# 이것이다 — 파일이 갈라지면 한쪽만 고치는 일이 반드시 생긴다.
#
# 처음 한 번만:  docker network create demo-net
# =====================================================================
services:
  proxy:
    image: nginx:1.27-alpine
    container_name: demo-proxy
    ports:
      - "${PROXY_PUBLISH:-80:80}"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      # 앱 하나에 파일 하나. portal.conf 가 여기를 include 한다.
      - ./apps:/etc/nginx/apps:ro
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    external: true
