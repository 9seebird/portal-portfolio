# ── 앱 입고 점검 ─────────────────────────────────────────────
#   서비스 ID   : intake
#   컨테이너    : demo-intake
#   접속 주소   : /intake/
#
# 이 파일은 portal.conf 의 server 블록 안으로 include 된다.
# 그래서 server{} 로 감싸지 않고 location 부터 바로 쓴다.
#
# 접근 범위를 넓게 두는 것이 맞는 앱이다. 다른 부서에서 앱을 만든 사람이
# 직접 올려 봐야 왕복이 줄어든다. 올린 파일은 저장되지 않는다.
# ─────────────────────────────────────────────────────────────

location = /intake { return 301 /intake/; }

location /intake/ {
    auth_request /_authz_intake;

    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $intake_upstream http://demo-intake:8080;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 안 잘라 준다.
    rewrite ^/intake/?(.*)$ /$1 break;
    proxy_pass $intake_upstream;

    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /intake;

    # 체험판은 예시만 검사하므로 올라오는 것이 없다. 사내판에서 올리기를 열면
    # 앱의 MAX_UPLOAD_MB 와 짝을 맞춰 올린다 (한쪽만 올리면 소용없다).
    client_max_body_size 2m;

    # 파일이 많은 앱은 검사에 시간이 걸린다. 앱 쪽 CHECK_TIMEOUT(120) 보다 넉넉히.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # 결과는 매번 다르다. 캐시가 남으면 옛 점검 결과가 보인다.
    add_header Cache-Control "no-store, must-revalidate" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /_authz_intake {
    internal;
    set $authz_intake http://portal:8080/api/authz?service=intake;
    proxy_pass $authz_intake;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
