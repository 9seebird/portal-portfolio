# ── prompt ────────────────────────────────────────────────────────
#   서비스 ID   : prompt        (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : guide-web  (매뉴얼·체크리스트와 한 컨테이너에 있다)
#   접속 주소   : /prompt/
#   컨테이너 안 : /prompt/
#
# 정적 파일 앱이라 컨테이너는 하나인데 서비스는 넷이다. 여기서 경로를
# 나누고 **각각 따로 권한을 묻는다.** 이 화면은 전 직원용이지만
# 운영 체크리스트는 담당자만 봐야 하는 식으로 갈리기 때문이다.
#
# portal.conf 의 server 블록 안으로 include 된다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 쳐도 들어가지게
location = /prompt { return 301 /prompt/; }

location /prompt/ {
    auth_request /_authz_prompt;

    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $guide_prompt_upstream http://demo-guide-web:80;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로를 잘라 주지 않는다.
    # 바깥 주소(/prompt/)와 컨테이너 안 폴더(/prompt/)가 다르므로
    # 여기서 바꿔 준다.
    rewrite ^/prompt/?(.*)$ /prompt/$1 break;
    proxy_pass $guide_prompt_upstream;

    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /prompt;
}

location = /_authz_prompt {
    internal;
    set $authz_prompt http://demo-portal:8080/api/authz?service=prompt;
    proxy_pass $authz_prompt;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
