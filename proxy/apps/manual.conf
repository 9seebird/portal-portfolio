# ── manual ──────────────────────────────────────────────────────
#   서비스 ID   : manual      (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : guide-web  (매뉴얼·체크리스트가 한 컨테이너에 있다)
#   접속 주소   : /manual/
#   컨테이너 안 : /manuals/
#
# 정적 파일 앱이라 컨테이너는 셋이 아니라 하나다. 대신 여기서 경로를
# 셋으로 나누고 **각각 따로 권한을 묻는다.** 매뉴얼은 전 직원이 봐도
# 되지만 운영 체크리스트는 담당자만 봐야 할 수 있기 때문이다.
#
# portal.conf 의 server 블록 안으로 include 된다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 쳐도 들어가지게
location = /manual { return 301 /manual/; }

# PPT 원본과 백업은 매뉴얼 폴더 안에 있지만 **보라고 둔 것이 아니다.**
# 매뉴얼을 볼 수 있는 사람과 고칠 수 있는 사람은 다르다.
# 원본이 필요하면 매뉴얼 가져오기(/manual-import/)에서 받는다.
location ~ ^/manual/(sources|data/backup)/ { return 404; }

location /manual/ {
    auth_request /_authz_manual;

    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $guide_manual_upstream http://demo-guide-web:80;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로를 잘라 주지 않는다.
    # 바깥 주소(/manual/)와 컨테이너 안 폴더(/manuals/)가 다르므로
    # 여기서 바꿔 준다.
    rewrite ^/manual/?(.*)$ /manuals/$1 break;
    proxy_pass $guide_manual_upstream;

    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manual;
}

location = /_authz_manual {
    internal;
    set $authz_manual http://demo-portal:8080/api/authz?service=manual;
    proxy_pass $authz_manual;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
