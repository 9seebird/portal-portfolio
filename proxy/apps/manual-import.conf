# ── 매뉴얼 가져오기 ──────────────────────────────────────────
#   서비스 ID   : manual-import  (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : manual-import
#   접속 주소   : /manual-import/
#
# 이 파일은 portal.conf 의 server 블록 안으로 include 된다.
# 그래서 server{} 로 감싸지 않고 location 부터 바로 쓴다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 /manual-import 로 들어오면 포털로 넘어가 404 가 난다.
location = /manual-import { return 301 /manual-import/; }

location /manual-import/ {
    # (1) 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
    #     401/403 이면 여기서 끝나고 앱까지 요청이 가지 않는다.
    auth_request /_authz_manual-import;

    # (2) 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $manual_import_upstream http://demo-manual-import:8080;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
    # 그대로 두면 /manual-import/api/preview 가 전부 / 로 뭉개져서
    # API 요청에 화면 HTML 이 돌아온다. rewrite 로 직접 잘라 준다.
    rewrite ^/manual-import/?(.*)$ /$1 break;
    proxy_pass $manual_import_upstream;

    # (3) 앱에는 이 헤더만 넘어간다. 앱은 이것만 읽으면 된다.
    #     이름·부서는 한글이라 퍼센트 인코딩되어 있다 (unquote 필요).
    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manual-import;

    # 캡처가 많은 PPT 는 쉽게 수십 MB 가 된다. 앱이 60MB 까지 받으므로
    # 여기서 먼저 막히지 않게 한다. 이 줄이 없으면 nginx 기본값(1MB)에 걸려
    # 413 이 난다.
    client_max_body_size 60m;
    # 큰 파일을 읽고 그림을 뽑는 데 시간이 걸린다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 매뉴얼을 바꾼 직후 목록을 다시 부르므로 옛 응답을 주면 안 된다.
    add_header Cache-Control "no-store, must-revalidate" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /_authz_manual-import {
    internal;                       # 브라우저가 직접 부를 수 없다
    set $authz_manual_import http://demo-portal:8080/api/authz?service=manual-import;
    proxy_pass $authz_manual_import;
    proxy_pass_request_body off;    # 본문은 필요 없다
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
