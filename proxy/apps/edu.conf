# ── 온라인 교육 이수 ─────────────────────────────────────────
#   서비스 ID   : edu            (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : demo-edu
#   접속 주소   : /edu/          (담당자 화면은 /edu/admin)
#
# 이 파일은 portal.conf 의 server 블록 안으로 include 된다.
# 그래서 server{} 로 감싸지 않고 location 부터 바로 쓴다.
#
# 영상은 이 앱이 내보내지 않는다. 유튜브가 직접 재생하고, 이 앱은 재생 위치만
# 받아 적는다. 사내 영상 파일을 직접 서빙해야 하면 맨 아래 주석을 참고할 것.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 /edu 로 들어오면 포털로 넘어가 404 가 난다.
location = /edu { return 301 /edu/; }

location /edu/ {
    # (1) 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
    #     401/403 이면 여기서 끝나고 앱까지 요청이 가지 않는다.
    auth_request /_authz_edu;

    # (2) 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $edu_upstream http://demo-edu:8080;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
    # rewrite 로 직접 잘라 주지 않으면 API 요청에 화면 HTML 이 돌아온다.
    rewrite ^/edu/?(.*)$ /$1 break;
    proxy_pass $edu_upstream;

    # (3) 앱에는 이 헤더만 넘어간다. 앱은 이것만 읽으면 된다.
    #     이름·부서는 한글이라 퍼센트 인코딩되어 있다 (unquote 필요).
    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /edu;

    # 담당자가 올리는 PDF. portal.conf 의 150m 안쪽이지만 명시해 둔다.
    client_max_body_size 50m;

    # 배포해도 직원 브라우저에 옛 화면이 남지 않게 한다.
    add_header Cache-Control "no-store, must-revalidate" always;
}

location = /_authz_edu {
    internal;                       # 브라우저가 직접 부를 수 없다
    set $authz_edu http://demo-portal:8080/api/authz?service=edu;
    proxy_pass $authz_edu;
    proxy_pass_request_body off;    # 본문은 필요 없다
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}

# ── 사내 영상을 직접 서빙해야 할 때 ────────────────────────────────────────
#
# 유튜브에 올릴 수 없는 자료 영상은 **nginx 가 직접 내보낸다.**
# 앱(uvicorn)이 영상을 내보내면 워커가 스트림을 붙들고 있는 동안 그 앱의 다른
# 요청이 밀린다. nginx 는 sendfile 로 커널에서 바로 내보내 동시 접속에 강하다.
#
# 720p(약 2Mbps)면 동시 30명이 붙어도 60Mbps 남짓이라 사내망에서 여유롭다.
# 다만 이 방식은 재생 위치를 받아올 수 없어 진도 자동 판정이 되지 않는다.
#
# location /edu-media/ {
#     auth_request /_authz_edu;          # 교육 대상자만 볼 수 있게 같은 관문을 쓴다
#     alias /usr/share/nginx/edu-media/;
#     sendfile on;
#     tcp_nopush on;
#     add_header Accept-Ranges bytes;    # 되감기·이어보기가 되려면 필요하다
# }
