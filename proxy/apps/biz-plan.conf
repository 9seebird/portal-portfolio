# ── 사업계획 예상손익 ─────────────────────────────────────────
#   서비스 ID   : biz-plan  (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : biz-plan
#   접속 주소   : /biz-plan/
#
# 이 파일은 portal.conf 의 server 블록 안으로 include 된다.
# 그래서 server{} 로 감싸지 않고 location 부터 바로 쓴다.
#
# 이 앱은 파일도 작고(예시 둘 합쳐 0.4MB) 계산도 1초 안쪽이라
# 크게 늘려 둘 것이 없다. 다만 값을 화면에서 고쳐 다시 계산하고 엑셀을
# 만드는 과정이 있어, 요청 시간은 조금 여유를 둔다.
# ─────────────────────────────────────────────────────────────

location = /biz-plan { return 301 /biz-plan/; }

location /biz-plan/ {
    # (1) 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
    auth_request /_authz_biz-plan;

    # (2) 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $biz_plan_upstream http://demo-biz-plan:8080;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
    rewrite ^/biz-plan/?(.*)$ /$1 break;
    proxy_pass $biz_plan_upstream;

    # (3) 앱에는 이 헤더만 넘어간다.
    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /biz-plan;

    # 두 파일을 base64 로 담아 한 번에 보낸다. base64 는 원본보다 약 4/3 크다.
    # 앱은 한 개당 30MB 까지 받으므로(.env 의 BIZPLAN_MAX_MB) 여기서 먼저
    # 막히지 않게 그보다 넉넉히 둔다. ★ 앱 쪽 값을 올리면 여기도 같이 올린다.
    client_max_body_size 100m;

    client_body_timeout 120s;
    proxy_send_timeout  120s;

    # 계산 0.4초 · 엑셀 3개 1.4초. 챗이 부르는 /api/analyze 도 같은 길이다.
    proxy_read_timeout  120s;

    # 큰 파일을 디스크에 한 번 받아 두었다가 넘기지 말고 그대로 흘려보낸다.
    # 안 그러면 63MB 를 두 번 쓰게 된다.
    proxy_request_buffering off;

    # 새 파일을 올리면 결과가 달라진다. 옛 결과를 보여주면
    # "올렸는데 안 바뀐다" 가 된다.
    add_header Cache-Control "no-store, must-revalidate" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /_authz_biz-plan {
    internal;                       # 브라우저가 직접 부를 수 없다
    set $authz_biz_plan http://demo-portal:8080/api/authz?service=biz-plan;
    proxy_pass $authz_biz_plan;
    proxy_pass_request_body off;    # 본문은 필요 없다
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
