# ── selfcheck ────────────────────────────────────────────────────────
#   서비스 ID   : selfcheck    (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : demo-guide-web  (매뉴얼·체크리스트·생성기와 한 컨테이너에 있다)
#   접속 주소   : /selfcheck/
#   컨테이너 안 : /selfcheck/
#
# 전산팀에 연락하기 전에 직원이 스스로 확인하는 자가진단 체크리스트다.
# 증상 27개. 다 확인해도 안 되면 접수 문구를 만들어 준다.
#
# portal.conf 의 server 블록 안으로 include 된다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 쳐도 들어가지게
location = /selfcheck { return 301 /selfcheck/; }

location /selfcheck/ {
    auth_request /_authz_selfcheck;

    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $guide_selfcheck_upstream http://demo-guide-web:80;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로를 잘라 주지 않는다.
    rewrite ^/selfcheck/?(.*)$ /selfcheck/$1 break;
    proxy_pass $guide_selfcheck_upstream;

    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /selfcheck;
}

location = /_authz_selfcheck {
    internal;
    set $authz_selfcheck http://demo-portal:8080/api/authz?service=selfcheck;
    proxy_pass $authz_selfcheck;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
