# ── ai-ref ────────────────────────────────────────────────────────
#   서비스 ID   : ai-ref        (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : demo-guide-web  (매뉴얼·체크리스트·생성기와 한 컨테이너에 있다)
#   접속 주소   : /ai-ref/
#   컨테이너 안 : /ai-ref/
#
# AI 용어 · 프롬프트 · 바이브코딩 입문을 한 곳에서 검색한다. 전 직원용이다.
#
# portal.conf 의 server 블록 안으로 include 된다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 쳐도 들어가지게
location = /ai-ref { return 301 /ai-ref/; }

location /ai-ref/ {
    auth_request /_authz_airef;

    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $guide_airef_upstream http://demo-guide-web:80;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로를 잘라 주지 않는다.
    rewrite ^/ai-ref/?(.*)$ /ai-ref/$1 break;
    proxy_pass $guide_airef_upstream;

    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-ref;
}

location = /_authz_airef {
    internal;
    set $authz_airef http://portal:8080/api/authz?service=ai-ref;
    proxy_pass $authz_airef;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
