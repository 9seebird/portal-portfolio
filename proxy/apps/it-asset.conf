# ── it-asset ──────────────────────────────────────────────────────
#   서비스 ID   : it-asset      (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : asset-web
#   접속 주소   : /it-asset/
#
# 이 앱은 컨테이너가 두 개다. 포털은 화면 쪽(asset-web)만 보면 되고,
# 그 안에서 /api/ 를 asset-api 로 넘기는 것은 앱이 알아서 한다.
#
# portal.conf 의 server 블록 안으로 include 된다.
# ─────────────────────────────────────────────────────────────

# 직원이 주소창에 /it-asset 를 슬래시 없이 치면 아래 location 이 안 걸려
# 포털로 넘어가 404 가 난다. 슬래시를 붙여서 돌려보낸다.
location = /it-asset { return 301 /it-asset/; }

location /it-asset/ {
    # 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
    # 401/403 이면 여기서 끝나고 앱까지 요청이 가지 않는다.
    auth_request /_authz_it-asset;

    # 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    # asset-web 은 nginx 라 컨테이너 안 포트가 80 이다.
    # 표준 규칙 v2 로 만든 앱은 8080 이지만, 이 앱은 그 전에 만들어졌다.
    set $it_asset_upstream http://demo-asset-web:80;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
    # rewrite 로 직접 잘라 주지 않으면 API 요청에 화면 HTML 이 돌아온다.
    rewrite ^/it-asset/?(.*)$ /$1 break;
    proxy_pass $it_asset_upstream;

    # 앱에는 이 헤더만 넘어간다. 앱은 이것만 읽으면 된다.
    # 이름·부서는 한글이라 퍼센트 인코딩되어 있다 (unquote 필요).
    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /it-asset;

    # 배포해도 직원 브라우저에 옛 화면이 남지 않게 한다.
    add_header Cache-Control "no-store, must-revalidate" always;
}

location = /_authz_it-asset {
    internal;                       # 브라우저가 직접 부를 수 없다
    set $authz_it_asset http://demo-portal:8080/api/authz?service=it-asset;
    proxy_pass $authz_it_asset;
    proxy_pass_request_body off;    # 본문은 필요 없다
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
