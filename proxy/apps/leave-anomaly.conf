# ── 휴가 이상감지 ────────────────────────────────────────────
#   서비스 ID   : leave-anomaly  (포털 관리자 화면의 ID 와 같아야 한다)
#   컨테이너    : leave-anomaly
#   접속 주소   : /leave-anomaly/
#
# 이 파일은 portal.conf 의 server 블록 안으로 include 된다.
# 그래서 server{} 로 감싸지 않고 location 부터 바로 쓴다.
# ─────────────────────────────────────────────────────────────

# 슬래시 없이 /leave-anomaly 로 들어오면 포털로 넘어가 404 가 난다.
location = /leave-anomaly { return 301 /leave-anomaly/; }

location /leave-anomaly/ {
    # (1) 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
    #     401/403 이면 여기서 끝나고 앱까지 요청이 가지 않는다.
    auth_request /_authz_leave-anomaly;

    # (2) 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
    auth_request_set $u_id   $upstream_http_x_user_id;
    auth_request_set $u_name $upstream_http_x_user_name;
    auth_request_set $u_dept $upstream_http_x_user_dept;
    auth_request_set $u_role $upstream_http_x_user_role;

    set $leave_anomaly_upstream http://demo-leave-anomaly:8080;   # set 이 rewrite 보다 먼저
    # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
    # 그대로 두면 /leave-anomaly/api/analysis 가 전부 / 로 뭉개져서
    # API 요청에 화면 HTML 이 돌아온다. rewrite 로 직접 잘라 준다.
    rewrite ^/leave-anomaly/?(.*)$ /$1 break;
    proxy_pass $leave_anomaly_upstream;

    # (3) 앱에는 이 헤더만 넘어간다. 앱은 이것만 읽으면 된다.
    #     이름·부서는 한글이라 퍼센트 인코딩되어 있다 (unquote 필요).
    proxy_set_header X-User-Id   $u_id;
    proxy_set_header X-User-Name $u_name;
    proxy_set_header X-User-Dept $u_dept;
    proxy_set_header X-User-Role $u_role;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /leave-anomaly;

    # 연차 엑셀을 올린다. 앱이 20MB 까지 받으므로 여기서 먼저 막히지 않게 한다.
    # 이 줄이 없으면 nginx 기본값(1MB)에 걸려 413 이 난다.
    client_max_body_size 20m;

    # 엑셀을 새로 올리면 분석 결과가 달라진다. 옛 결과를 보여주면
    # "올렸는데 안 바뀐다" 가 된다.
    add_header Cache-Control "no-store, must-revalidate" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /_authz_leave-anomaly {
    internal;                       # 브라우저가 직접 부를 수 없다
    set $authz_leave_anomaly http://demo-portal:8080/api/authz?service=leave-anomaly;
    proxy_pass $authz_leave_anomaly;
    proxy_pass_request_body off;    # 본문은 필요 없다
    proxy_set_header Content-Length "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI  $request_uri;
}
