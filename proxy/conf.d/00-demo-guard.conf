# =====================================================================
# 체험판 안전장치 — 입구에서 한 번 더
#
# 포털 안에도 같은 검사가 있다(portal/app/demo.py). 두 겹인 이유는
# **서로 못 보는 자리가 다르기 때문**이다.
#
#   포털의 검사   포털 자기 주소만 본다. 자산·매뉴얼·휴가 앱은 포털을
#                 거치지 않고 nginx 에서 바로 그 컨테이너로 간다.
#   여기의 검사   모든 앱을 본다. 대신 앱 안쪽 사정은 모른다.
#
# 앱이 여덟 개이고 상태를 바꾸는 주소가 백 개가 넘는다. 하나하나 세어
# 막는 방식은 **셀 때마다 빠뜨린다.** 그래서 반대로 한다.
#
#       바꾸는 요청은 전부 막고, 안전한 것만 이름을 적어 연다.
#
# 새 앱을 붙이면 그 앱의 쓰기는 **자동으로 막힌 채로** 시작한다.
# 열려면 아래 목록에 적어야 한다. 실수의 방향이 안전한 쪽이다.
#
# 이 파일은 공개 데모 저장소에만 있다. 사내에는 없다.
# =====================================================================

# ── 1. 바꾸는 요청인가 ──────────────────────────────────────
map $request_method $demo_unsafe {
    default  0;
    POST     1;
    PUT      1;
    PATCH    1;
    DELETE   1;
}

# ── 2. 그중 열어 둘 것 ──────────────────────────────────────
#
# 기준은 하나다 — **요청이 끝나면 사라지는가.**
# 엑셀을 올려 계산하고 결과를 받는 것은 남지 않는다. 계정을 만들거나
# 자산을 고치는 것은 다음 사람에게 그대로 남는다.
#
# $uri 는 앱 앞의 /biz-plan/ 같은 부분이 **붙어 있는 상태**다.
# (rewrite 로 잘리기 전 값이라, 여기 적는 대로 맞는다)
map $uri $demo_allow {
    default 0;

    # ── 포털 (/ 밑) ────────────────────────────────────────
    /api/login          1;
    /api/logout         1;
    /api/audit          1;   # 누가 무엇을 했는지 기록만 남긴다
    /api/upload         1;   # 챗에 파일 붙이기
    /api/chat           1;
    /api/chat/stream    1;
    # 내가 만든 대화를 내가 지우는 것. 남의 것은 애초에 안 보인다.
    ~^/api/sessions/    1;
    ~^/api/memory/      1;
    # ★ /api/me/password 는 여기 없다. 열면 첫 손님이 비밀번호를 바꾸고
    #   그 순간 데모가 끝난다. 실제로 이걸 빠뜨릴 뻔했다.

    # ── 사업계획 예상손익 ───────────────────────────────────
    # 파일을 메모리에서 계산하고 버린다. 저장하는 것이 아예 없다.
    ~^/biz-plan/api/(run|recompute|export|analyze)$   1;

    # ── 앱 입고 점검 ───────────────────────────────────────
    # 미리 넣어 둔 예시를 검사하고 결과만 돌려준다. 저장하는 것이 없다.
    # 올리기(/intake/api/check)는 앱이 체험판에서 스스로 403 을 낸다 —
    # 여기서도 안 열어 두어 두 겹으로 막는다.
    ~^/intake/api/check/.+$                           1;

    # ── 매뉴얼 등록 ────────────────────────────────────────
    # preview 는 PPT 를 읽어 **무엇으로 바뀌는지 보여주기만** 한다.
    # apply 가 실제로 저장하는 쪽이라 막혀 있다.
    # 체험판에서 이 앱을 보여주기에 오히려 이 조합이 낫다 —
    # 파서가 무엇을 하는지가 apply 없이도 다 보인다.
    /manual-import/api/preview                        1;

    # ── 온라인 교육 ────────────────────────────────────────
    # 진도 기록은 **로그인한 계정 자기 것**만 쌓인다(사람×차시가 키다).
    # 체험 계정 하나로만 들어올 수 있으므로 남의 것을 건드릴 길이 없다 —
    # 위의 「내 대화 지우기」와 같은 부류다.
    #
    # 이걸 막으면 이 앱에서 볼 것이 없어진다. 실제로 재생된 구간만 진도로
    # 인정하는 판정이 이 앱의 알맹이인데, 그 요청이 바로 여기다.
    /edu/api/progress                                 1;
    ~^/edu/api/lessons/[0-9]+/done$                   1;
    # ★ /edu/api/admin/ 은 열지 않는다. 과정·차시·명단은 다음 사람에게 남는다.
    #   담당자 화면은 볼 수 있고, 고치려 하면 여기서 막힌다.
}

# ── 2-2. 메서드까지 봐야 여닫이가 갈리는 것 ─────────────────
#
# 위의 $demo_allow 는 **주소만** 본다. 자리 배치는 그것만으로 부족하다.
#
#     옮기기   PATCH  /it-asset/api/seats/{id}      ← 열고 싶다
#     지우기   DELETE /it-asset/api/seats/{id}      ← 막아야 한다
#
# 주소가 글자 하나 다르지 않다. 주소만 보는 map 에 적으면 둘 다 열린다.
# 그래서 메서드를 앞에 붙인 값으로 한 번 더 본다.
map $request_method$uri $demo_allow_method {
    default 0;

    # ── 자산관리 · 자리 배치 — 옮기기만 ────────────────────
    #
    # 왜 여는가.
    #   배너에는 "계정 · 자산 · 서비스 · 비밀번호만 막았다"고 적어 두었는데
    #   자리 배치도 막혀 있었다. 눌러 보는 사람 입장에서는 적힌 것과 다르게
    #   막히는 셈이라, 안내문 전체를 못 믿게 된다.
    #   그리고 이 앱에서 제일 보여줄 만한 화면이 배치도인데, 막아 두면
    #   방문자가 할 수 있는 것이 보기뿐이다.
    #
    # 남는 것 아닌가.
    #   남는다. 다만 되돌리기 버튼이 화면에 있고, 틀어져도
    #   `python scripts/import_layout.py --yes` 로 배치를 다시 넣으면 된다.
    #   계정·비밀번호처럼 **되돌릴 수 없는 것**과는 무게가 다르다.
    #
    # 여기서 여는 것은 좌표를 고치는 PATCH 하나뿐이다.
    #   만들기(POST) · 지우기(DELETE) · 사람 앉히기(PUT .../employee) 는
    #   그대로 막힌다. 칸을 지워 버리면 되돌리기로도 안 돌아온다.
    ~^PATCH/it-asset/api/seats/[^/]+$                 1;
}

# ── 3. 셋을 합친다 ─────────────────────────────────────────
#   "100" = 바꾸는 요청인데 두 허용 목록 어디에도 없다 → 막는다
#   (자리 옮기기는 "101" 이라 여기 안 걸린다)
map $demo_unsafe$demo_allow$demo_allow_method $demo_deny {
    default 0;
    "100"   1;
}
