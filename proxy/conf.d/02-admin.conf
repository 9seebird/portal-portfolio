# =====================================================================
# 주인 전용 입구 — 체험판 가드가 없는 문.
#
# 왜 필요한가
# ───────────
# 공개 주소(80)에는 00-demo-guard.conf 가 늘 걸려 있다. 방문자가 남는
# 것을 바꾸지 못하게 막는 장치인데, **주인도 똑같이 막힌다.** 그래서
# 데모 내용을 고치려면 가드 파일을 잠깐 치웠다가 되돌려야 했고,
# portal.conf 가 $demo_deny 를 참조하는 탓에 치우는 순간 nginx 설정이
# 깨졌다. 문을 하나 더 내는 편이 안전하다.
#
# 안전한가
# ────────
# 1. 127.0.0.1 로만 열린다(docker-compose.yml 의 포트 설정). 인터넷에서도
#    사내망에서도 이 포트에 닿을 수 없다. 서버에서는 SSH 로 들어와야 한다.
# 2. 로그인은 그대로다. 포털의 auth_request 가 여기서도 똑같이 돈다 —
#    없어진 것은 「체험판이라 저장 금지」 한 겹뿐이고, 권한 검사는 남아 있다.
#
# 어떻게 쓰나
# ───────────
#   로컬(회사 PC · 집 PC)   http://127.0.0.1:8082/
#   Azure 서버              먼저 터널을 뚫고 같은 주소로 들어간다
#       ssh -L 8082:127.0.0.1:8082 <계정>@<서버주소>
#       → 브라우저에서 http://127.0.0.1:8082/
#
# 라우팅은 _routes.inc 한 곳에만 있다. 80 과 8082 가 같은 파일을 읽으므로
# 앱을 추가해도 두 입구가 갈라지지 않는다.
# =====================================================================
server {
    listen 8082;
    server_name _;

    include /etc/nginx/conf.d/_common.inc;

    # ★ 여기에 demo 가드가 없다. 그것이 이 파일의 전부다.

    # 포털 안에도 같은 취지의 검사가 하나 더 있다(portal/app/demo.py).
    # nginx 만 열어 두면 자산·매뉴얼·교육은 고칠 수 있어도 **포털의 계정·
    # 서비스 화면은 여전히 막힌다.** 이 표시를 넘겨 그쪽도 같이 연다.
    set $demo_admin 1;

    include /etc/nginx/conf.d/_routes.inc;
}
