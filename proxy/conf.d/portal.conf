# =====================================================================
# 사내 포털 리버스 프록시 — 공통 부분
#
# 직원은 포트 번호를 모른 채 한 주소만 쓴다.
#
#   /            → portal   (챗 화면·관리자 화면·인증)
#   /서비스ID/   → 그 앱의 컨테이너
#
# 앱마다의 설정은 이 파일이 아니라  ../apps/서비스ID.conf  에 하나씩 둔다.
# 이 파일은 앱이 스무 개가 되어도 그대로다.
# =====================================================================

# 업스트림을 변수가 아닌 이름으로 두면, 해당 컨테이너가 내려가 있을 때
# nginx 자체가 뜨지 않는다. resolver 를 써서 요청 시점에 찾도록 한다.
# 대신 변수를 쓰면 경로 자동 절삭이 사라지므로 rewrite 를 함께 써야 한다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 업로드 파일 크기. 각 앱의 MAX_UPLOAD_MB 보다 넉넉하게.
    #
    # 20m 이던 것을 150m 로 올렸다. 큰 엑셀 때문이다 —
    # 6월 마감본이 63MB 라, 챗에 붙이면 20m 에서 413 으로 튕겼다.
    # 앱마다 더 필요하면 그 앱의 conf 에서 다시 키운다
    # (앱에 따라 300m 까지 둔다). 여기 값은 그보다 작아도 되지만,
    # **챗에 붙이는 파일은 여기를 지나므로** 챗에서 다룰 가장 큰 파일보다 커야 한다.
    client_max_body_size 150m;

    # 리다이렉트를 "/login" 처럼 상대 주소로 내보낸다.
    #
    # 기본값(on)이면 nginx 가 스스로 절대 주소를 만들어 붙인다.
    #   Location: http://portal.nuricos.example.com/login
    # 앞에 호스트 nginx 가 있고 브라우저가 https 로 들어온 경우,
    # 이 http 주소로 한 번 튕겼다가 다시 https 로 돌아오게 된다.
    # 컨테이너를 8081 같은 포트로 띄우면 그 포트까지 붙어서
    #   Location: http://...:8081/login   ← 브라우저가 못 가는 주소
    # 가 나간다. 상대 주소로 두면 브라우저가 현재 주소·스킴을 그대로 쓴다.
    absolute_redirect off;

    # ── 체험판 ────────────────────────────────────────────
    # 00-demo-guard.conf 가 정한 대로, 「남는 것을 바꾸는 요청」을
    # 앱에 닿기 전에 끊는다. auth_request 보다도 앞이다.
    #
    # 460 은 표준 상태 코드가 아니다. nginx 안에서만 쓰는 표식으로,
    # 바로 아래 error_page 가 받아서 진짜 응답(403)으로 바꾼다.
    # if 블록 안에서는 default_type 을 쓸 수 없어서 이렇게 한 번 돈다.
    if ($demo_deny) { return 460; }
    error_page 460 = @demo_denied;

    location @demo_denied {
        default_type application/json;
        # 화면들이 공통으로 detail 을 읽어 띄운다. 그래서 같은 모양으로 맞춘다.
        #
        # ★ 줄바꿈을 \\n 으로 두 번 적는 이유.
        #   nginx 는 따옴표 안의 \n 을 **진짜 줄바꿈으로 바꿔** 내보낸다.
        #   그런데 JSON 문자열 안에는 진짜 줄바꿈이 들어갈 수 없어서,
        #   받는 쪽 JSON.parse 가 통째로 실패한다. 화면에는 안내문 대신
        #   "알 수 없는 오류" 만 뜬다. 처음에 이렇게 만들어 놓고 눈치채지
        #   못할 뻔했다 — 상태 코드(403)는 멀쩡했기 때문이다.
        return 403 '{"detail":"체험판에서는 저장되지 않습니다.\\n\\n보기 · 엑셀 올려 계산 · 챗 · 검색은 전부 되지만, 다음 사람에게 남는 것(계정 · 자산 · 서비스 · 비밀번호)만 막아 두었습니다."}';
    }

    # ── 챗 포털 (메인) ───────────────────────────────────────
    location / {
        set $portal_upstream http://demo-portal:8080;
        proxy_pass $portal_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 클라이언트가 직접 넣은 X-Forwarded-For 를 덮어쓴다.
        # 그대로 두면 접속 IP 를 위조할 수 있고, 포털의 IP 제한이 무의미해진다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗 응답은 SSE(text/event-stream) 로 조금씩 내려온다.
        # 버퍼링을 켜 두면 다 끝난 뒤 한 번에 나와서 진행 표시가 무의미해진다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        # 화면(HTML/JS)을 캐시하면 배포해도 직원 브라우저에는 옛 화면이 남는다.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # =================================================================
    # 앱별 설정을 여기서 끌어온다.
    #
    #   proxy/apps/ai-report.conf      ← 앱 하나에 파일 하나
    #   proxy/apps/meeting-room.conf
    #
    # 앱을 추가할 때 이 파일은 건드리지 않는다. apps/ 에 파일만 새로 넣는다.
    #   .\new-app.ps1 meeting-room
    #
    # 파일이 하나도 없어도 nginx 는 정상적으로 뜬다 (와일드카드 include).
    # =================================================================
    include /etc/nginx/apps/*.conf;

    # 권한이 없을 때 나가는 화면. 앱마다 따로 만들지 않아도 된다.
    error_page 401 = @login;
    error_page 403 = @denied;

    location @login {
        return 302 /login;
    }
    location @denied {
        default_type text/html;
        return 403 '<!doctype html><html lang="ko"><meta charset="utf-8"><title>접근 권한 없음</title><body style="margin:0;display:grid;place-items:center;height:100vh;font-family:system-ui,sans-serif;background:#f5f6f8;color:#1f2023"><div style="text-align:center"><div style="font-size:17px;font-weight:650;margin-bottom:8px">이 서비스를 이용할 권한이 없습니다</div><div style="font-size:13px;color:#8a8e97;margin-bottom:20px">필요하시면 IT 담당자에게 문의해주세요.</div><a href="/" style="display:inline-block;padding:9px 18px;border-radius:9px;background:#132033;color:#fff;text-decoration:none;font-size:13.5px">포탈로 돌아가기</a></div></body></html>';
    }
}

# ── 도메인과 인증서가 준비되면 443 블록을 추가한다 ──────────
# HTTPS 로 전환하면 포털 .env 에 COOKIE_SECURE=1 을 넣을 것.
