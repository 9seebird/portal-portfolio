<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>앱 입고</title>
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;--paper:#fff;
      --ok:#15803d;--okbg:#eaf6ee;--warn:#a16207;--warnbg:#fdf6e3;--bad:#b91c1c;--badbg:#fdeceb;--brand:#1f4e79}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.6 "맑은 고딕","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:23px;margin:0 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.drop{border:2px dashed #c7cdd6;border-radius:12px;background:var(--paper);
      padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:#f4f8fc}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.drop span{color:var(--muted);font-size:13px}
button{font:inherit;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.go{background:var(--brand);color:#fff;font-weight:700}
.go:disabled{background:#c3cad3;cursor:not-allowed}
.verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;margin-bottom:18px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.warn{background:var(--warnbg);color:var(--warn)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict b{font-size:17px}
.verdict p{margin:2px 0 0;font-size:13.5px;color:var(--ink);opacity:.75}
.tally{margin-left:auto;font-size:13px;white-space:nowrap;color:var(--ink);opacity:.7}
h2{font-size:14px;margin:20px 0 8px;color:var(--muted);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f5;font-size:14px}
li:last-child{border-bottom:0}
.m{flex:0 0 18px;font-weight:800;text-align:center}
.m.ok{color:var(--ok)} .m.warn{color:var(--warn)} .m.bad{color:var(--bad)} .m.note{color:#9aa3ad}
li.note{color:var(--muted);font-size:13px}
.human{background:#fbfaf6;border:1px solid #ece7d9}
.human li{border-bottom:0;padding:5px 0;align-items:flex-start}
.human .n{flex:0 0 20px;color:var(--brand);font-weight:800}
.err{background:var(--badbg);color:var(--bad);padding:14px 16px;border-radius:10px;font-size:14px}
.file{margin-top:14px;font-size:14px;color:var(--muted)}
.file b{color:var(--ink)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
.hide{display:none}
.sample{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
        background:var(--paper);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;margin-bottom:10px;transition:.15s}
.sample:hover{border-color:var(--brand);background:#f4f8fc}
.sample:last-child{margin-bottom:0}
.sample .tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.sample .tag.ok{background:var(--okbg);color:var(--ok)}
.sample .tag.warn{background:var(--warnbg);color:var(--warn)}
.sample .tag.bad{background:var(--badbg);color:var(--bad)}
.sample b{display:block;font-size:15px;margin-bottom:2px}
.sample span{color:var(--muted);font-size:13px}
.sample:disabled{opacity:.55;cursor:wait}

/* ── 위쪽 길목 ────────────────────────────────────────────────
   왼쪽은 늘 포털로 돌아가는 길, 오른쪽은 이 앱의 다른 화면.
   「← 포탈로」 는 포털이 주는 /back.js 가 맡는다 — 포털에서 열린 탭이면
   포털 탭으로 옮겨 가고 이 탭을 닫는다. 앱마다 포털 탭이 하나씩
   늘어나지 않게 하려는 것이다. */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 18px}
.backportal{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:13px;text-decoration:none;color:var(--muted);background:var(--paper)}
.backportal:hover{background:#eef1f5;color:var(--ink)}
.togo{display:inline-block;padding:7px 13px;border:1.5px solid var(--line);border-radius:9px;
  font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--paper)}
.togo:hover{border-color:var(--ink)}
.togo.hot{border-color:#d92d20;color:#d92d20}

/* 제출 칸 (사내판에서만 나온다) */
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
label.f i{font-style:normal;font-weight:400;color:var(--muted)}
input.t,textarea.t{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);
  border-radius:9px;background:var(--paper);color:inherit;outline:none}
input.t:focus,textarea.t:focus{border-color:var(--brand)}
textarea.t{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.hint code{background:#eef1f5;padding:1px 5px;border-radius:4px}
.fixme{color:var(--warn);font-weight:700}
.fixme button{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;margin-left:6px;
  border-radius:100px;border:1.5px solid var(--warn);background:var(--paper);color:var(--warn);cursor:pointer}
.fixme button:hover{background:var(--warn);color:#fff}
.dupe{color:var(--warn)}
.freeok{color:var(--ok)}
input.t.bad{border-color:var(--warn)}

/* 「내가 올린 것」 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;
   padding:8px 10px;background:#f3f5f8;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #f1f3f5;vertical-align:top}
tr:last-child td{border-bottom:0}
.tag2{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.s-checked{background:#eef2ff;color:#3730a3}.s-requested{background:#e0f2fe;color:#075985}
.s-approved{background:var(--okbg);color:var(--ok)}.s-rejected{background:var(--badbg);color:var(--bad)}
.s-superseded{background:#f1f2f4;color:#6b7280}
.empty{color:var(--muted);font-size:13.5px;padding:16px 0}
.reqrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.ghost:hover{border-color:var(--ink)}
textarea.fix{width:100%;min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
  line-height:1.7;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;background:#fbfbfc;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="backportal" href="/">← 포탈로</a>
    <!-- 담당자일 때만 보인다 (paintTogo) -->
    <a class="togo" id="togo" href="#" hidden>담당자 화면 →</a>
  </div>
  <h1>앱 입고</h1>
  <p class="lead" id="lead">불러오는 중…</p>

  <div class="card hide" id="samplecard">
    <div id="samples"></div>
  </div>

  <div class="card hide" id="uploadcard">
    <div class="drop" id="drop">
      <b>zip 파일을 여기에 놓거나 눌러서 고르세요</b>
      <span>앱 폴더를 통째로 압축한 것 · 최대 50MB</span>
      <input type="file" id="pick" accept=".zip,application/zip" hidden>
    </div>
    <div class="file hide" id="fileline"></div>

    <label class="f" for="sid">서비스 ID</label>
    <input class="t" id="sid" placeholder="meeting-room" autocomplete="off">
    <div class="hint" id="sidHint"></div>

    <label class="f" for="title">앱 이름</label>
    <input class="t" id="title" placeholder="회의실 예약" autocomplete="off">

    <label class="f" for="note">전할 말 <i>(선택)</i></label>
    <textarea class="t" id="note" placeholder="무엇을 하는 앱인지, 봐 주셨으면 하는 부분이 있는지 적어 주세요."></textarea>

    <div style="margin-top:16px"><button class="go" id="go" disabled>올리고 검사하기</button></div>
  </div>

  <div id="out"></div>

  <div class="card" id="minecard">
    <h2 style="margin:0 0 10px">내가 올린 것</h2>
    <div id="mine"><p class="empty">아직 올린 것이 없습니다.</p></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const drop = $("#drop"), pick = $("#pick"), go = $("#go"), out = $("#out"), fileline = $("#fileline");
let chosen = null;

// 주소는 상대경로로 둔다. 포털은 이 앱을 /intake/ 아래에 두는데,
// "/api/check" 로 부르면 포털 최상위로 가서 404 가 난다. (규칙 3)
const api = (p) => new URL(p, location.href).pathname;
// ★ api() 는 **경로만** 돌려준다 (물음표 뒤는 날아간다).
//   질의를 붙일 때는 이쪽을 쓴다. 전에 api("...?mine=1") 로 불렀다가
//   조건이 조용히 빠진 채로 전부 돌아온 적이 있다.
const apiq = (p, q) => api(p) + "?" + new URLSearchParams(q).toString();

// 체험판인지 사내판인지 물어보고 화면을 정한다.
// 화면이 스스로 정하지 않는다 — 서버가 무엇을 받는지가 진실이다.
(async () => {
  let m = { demo:false, samples:[], max_upload_mb:50 };
  try { m = await (await fetch(api("api/mode"))).json(); } catch(e){}
  if (m.demo) {
    $("#lead").innerHTML = `앱을 포털에 붙이기 전에 회사 표준 규칙에 맞는지 확인하는 도구입니다.
      <b>체험판이라 파일을 올릴 수는 없고</b>, 미리 넣어 둔 앱 셋 중에서 골라 결과를 보실 수 있습니다.
      검사하는 코드는 실제와 같습니다.`;
    const marks = ["ok","warn","bad"];
    $("#samples").innerHTML = m.samples.map((s,i) =>
      `<button class="sample" data-id="${esc(s.id)}">
         <span class="tag ${marks[i]||"warn"}">예시 ${i+1}</span>
         <span style="flex:1"><b>${esc(s.label)}</b><span>${esc(s.hint)}</span></span>
       </button>`).join("");
    $("#samplecard").classList.remove("hide");
    document.querySelectorAll(".sample").forEach(b => b.onclick = () => checkSample(b));
  } else {
    $("#lead").innerHTML = `만든 앱을 zip 으로 올리면 회사 표준 규칙에 맞는지 확인해 드립니다.
      <b>✗ 가 하나라도 있으면 포털에 붙일 수 없습니다.</b> 고쳐서 다시 올려 보세요.
      이 화면은 파일을 저장하지 않습니다.`;
    $("#uploadcard").classList.remove("hide");
    $("#sidHint").innerHTML = HINT_BASE;
    $("#sid").addEventListener("input", () => { paintSid(); askSid(); });
    $("#sid").addEventListener("blur",  () => { paintSid(); askSid(); });
  }
  loadMine();
  paintTogo();
})();

async function checkSample(btn){
  document.querySelectorAll(".sample").forEach(b => b.disabled = true);
  const old = btn.querySelector("b").textContent;
  btn.querySelector("b").textContent = "올리는 중…";
  try{
    // 체험판도 **같은 주소로 제출한다.** 예시만 다른 길로 들어가면
    // 「예시에서는 되는데」가 생긴다. 서버가 파일 대신 예시 이름을 받을 뿐이다.
    const body = new FormData(); body.append("sample_id", btn.dataset.id);
    const r = await fetch(api("api/intakes"), { method:"POST", body });
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "점검에 실패했습니다.");
    show(render(j)); wireActions();
    loadMine();
  }catch(e){ show(err(e.message)); }
  btn.querySelector("b").textContent = old;
  document.querySelectorAll(".sample").forEach(b => b.disabled = false);
}

drop.onclick = () => pick.click();
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", ev => choose(ev.dataTransfer.files[0]));
pick.onchange = () => choose(pick.files[0]);

function choose(f){
  if(!f) return;
  if(!f.name.toLowerCase().endsWith(".zip")){ show(err("zip 파일만 올릴 수 있습니다.")); return; }
  chosen = f;
  fileline.innerHTML = `고른 파일 — <b>${esc(f.name)}</b> (${(f.size/1024/1024).toFixed(1)}MB)`;
  fileline.classList.remove("hide");
  go.disabled = false;
  out.innerHTML = "";
}

go.onclick = async () => {
  if(!chosen) return;
  const why = sidProblem($("#sid").value);
  if(!$("#sid").value.trim()){ show(err("서비스 ID 를 입력해 주세요.")); $("#sid").focus(); return; }
  if(why){ paintSid(); show(err(why)); $("#sid").focus(); return; }

  go.disabled = true; go.textContent = "올리고 검사하는 중…";
  const body = new FormData();
  body.append("file", chosen);
  body.append("service_id", $("#sid").value.trim());
  body.append("title", $("#title").value.trim());
  body.append("note", $("#note").value.trim());
  try{
    const r = await fetch(api("api/intakes"), { method:"POST", body });
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "점검에 실패했습니다.");
    show(render(j)); wireActions();
    loadMine();
  }catch(e){ show(err(e.message)); }
  go.disabled = false; go.textContent = "올리고 검사하기";
};

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = (html) => { out.innerHTML = html; out.scrollIntoView({behavior:"smooth", block:"nearest"}); };
const err  = (m) => `<div class="err">${esc(m)}</div>`;

const VERDICT = {
  ok:   ["켜도 됩니다", "막는 항목이 없습니다. IT 담당자에게 전달하세요."],
  warn: ["켤 수 있습니다", "△ 는 막지는 않지만, 무엇인지 보고 전달하세요."],
  bad:  ["아직 안 됩니다", "✗ 를 먼저 고쳐 주세요. 하나라도 있으면 붙일 수 없습니다."],
};

function render(j){
  const [t, d] = VERDICT[j.verdict];
  const k = j.tally;
  let h = `<div class="verdict ${j.verdict}">
      <div><b>${esc(j.name)} — ${t}</b><p>${d}</p></div>
      <div class="tally">✓ ${k.ok} &nbsp; △ ${k.warn} &nbsp; ✗ ${k.bad}</div>
    </div>`;

  CUR = j;
  if(j.id) h += actions(j);

  // ✗ 와 △ 를 맨 위로 모은다. 고칠 사람이 찾아 헤매지 않게.
  const todo = [];
  j.sections.forEach(s => s.items.forEach(i => {
    if(i.mark === "bad" || i.mark === "warn") todo.push({...i, where: s.title});
  }));
  if(todo.length){
    h += `<div class="card"><h2 style="margin-top:0">고칠 것</h2><ul>` +
      todo.map(i => `<li><span class="m ${i.mark}">${i.mark==="bad"?"✗":"△"}</span>
        <span>${esc(i.text)}<br><span style="color:#9aa3ad;font-size:12px">${esc(i.where)}</span></span></li>`).join("") +
      `</ul></div>`;
  }

  h += `<div class="card">` + j.sections.map(s =>
      `<h2>${esc(s.title)}</h2><ul>` + s.items.map(i =>
        `<li class="${i.mark==="note"?"note":""}"><span class="m ${i.mark}">${
          {ok:"✓",warn:"△",bad:"✗",note:"·"}[i.mark]}</span><span>${esc(i.text)}</span></li>`
      ).join("") + `</ul>`
    ).join("") + `</div>`;

  h += `<div class="card human"><h2 style="margin-top:0">여기서부터는 사람이 봐야 합니다</h2><ul>` +
    [["숫자를 만드는 앱인가?","원본과 대조할 표본을 같이 주세요. 에러는 티가 나지만 틀린 숫자는 조용합니다."],
     ["제일 큰 실제 파일로 돌려봤나?","5MB 로 시험하고 63MB 에서 멈춘 일이 실제로 있었습니다."],
     ["지우기·되돌리기가 있나?","없으면 잘못 넣은 것이 영영 남습니다."],
     ["남기는 것이 개인정보·재무자료인가?","보관 기간과 지울 사람을 정해야 합니다."],
     ["담당자가 누구인가?","만든 사람과 다를 수 있습니다."]]
    .map(([q,a],n) => `<li><span class="n">${n+1}</span><span><b>${q}</b><br>
      <span style="color:#8b8578;font-size:13px">${a}</span></span></li>`).join("") +
    `</ul></div>`;

  h += `<details><summary>점검 원문 보기</summary><pre>${esc(j.raw)}</pre></details>`;
  return h;
}

/* ── 여기서부터 : 검사 뒤에 이어지는 것 ──────────────────────────
   검사 결과만 보여 주고 끝내면 만든 사람은 "그래서 이제 뭘 하지" 에서 멈춘다.
   통과했으면 담당자에게 보내는 버튼을, 걸렸으면 고칠 글을 그 자리에 둔다. */
let CUR = null;

function actions(j){
  const can = j.verdict === "ok" || j.verdict === "warn";
  // 고칠 것이 하나도 없으면 「고칠 내용」 버튼을 안 낸다. 눌러 봐야
  // "걸렸습니다" 로 시작하는 글이 나와서 방금 본 ✓ 와 어긋난다.
  const anyTodo = (j.tally.warn + j.tally.bad) > 0;
  return `<div class="card"><div class="reqrow">` +
    (can
      ? `<button class="go" id="req">전산담당에게 검토 요청</button>
         <span class="hint">요청하면 담당자가 원본을 받아 확인합니다.</span>`
      : `<span class="hint">✗ 를 먼저 고쳐 주세요. 하나라도 있으면 요청할 수 없습니다.</span>`) +
    (anyTodo ? `<button class="ghost" id="fix">고칠 내용 프롬프트 만들기</button>` : ``) +
    `</div><div id="fixbox"></div></div>`;
}

function wireActions(){
  const req = $("#req");
  if(req) req.onclick = async () => {
    req.disabled = true; req.textContent = "요청하는 중…";
    try{
      const r = await fetch(api("api/intakes/" + CUR.id + "/request"), { method:"POST" });
      const j = await r.json();
      if(!r.ok) throw new Error(j.detail || "요청하지 못했습니다.");
      req.textContent = "요청했습니다 ✓";
      resetForm();
      loadMine();
      paintTogo();
    }catch(e){ req.disabled = false; req.textContent = "전산담당에게 검토 요청";
               $("#fixbox").innerHTML = err(e.message); }
  };
  const fix = $("#fix");
  if(fix) fix.onclick = async () => {
    fix.disabled = true;
    try{
      const j = await (await fetch(api("api/intakes/" + CUR.id + "/fix-prompt"))).json();
      $("#fixbox").innerHTML =
        `<p class="hint" style="margin:0 0 8px">쓰시던 AI 에 그대로 붙여넣으시면 됩니다.</p>
         <textarea class="fix" readonly id="fixtext"></textarea>`;
      $("#fixtext").value = j.text;
    }catch(e){ $("#fixbox").innerHTML = err("프롬프트를 만들지 못했습니다."); }
    fix.disabled = false;
  };
}

/* 다음 앱을 이어서 올릴 수 있게 입력칸을 비운다 */
function resetForm(){
  chosen = null;
  const sid = $("#sid"); if(!sid) return;      // 체험판에는 이 칸이 없다
  sid.value = ""; $("#title").value = ""; $("#note").value = "";
  $("#pick").value = ""; fileline.classList.add("hide");
  $("#sidHint").innerHTML = HINT_BASE; sid.classList.remove("bad");
  go.disabled = true;
  clearTimeout(sidTimer); sidSeq++;            // 비운 뒤에 옛 답이 날아와 덮지 않게
}

/* ── 담당자 화면으로 가는 길 ─────────────────────────────────────
   담당자가 포털 카드를 누르면 이 화면으로 떨어진다. 여기엔 승인 버튼이
   없어서, 길을 안 열어 두면 할 일을 못 찾고 헤맨다. */
async function paintTogo(){
  const a = $("#togo"); if(!a) return;
  let me = null;
  try{ me = await (await fetch(api("api/me"))).json(); }catch(e){ return; }
  if(!me || me.role !== "admin") return;
  a.href = api("admin"); a.hidden = false;
  try{
    const b = await (await fetch(api("api/badge"))).json();
    if(b && b.count > 0){ a.textContent = "담당자 화면 — " + b.label + " →"; a.classList.add("hot"); }
    else { a.textContent = "담당자 화면 →"; a.classList.remove("hot"); }
  }catch(e){}
}

/* ── 내가 올린 것 ────────────────────────────────────────────── */
const STATUS = {checked:"검사 완료", requested:"검토 요청함", approved:"승인",
                rejected:"반려", superseded:"다시 올림"};

async function loadMine(){
  try{
    const d = await (await fetch(apiq("api/intakes", {mine: 1}))).json();
    if(!d.items.length){ $("#mine").innerHTML = `<p class="empty">아직 올린 것이 없습니다.</p>`; return; }
    $("#mine").innerHTML =
      `<table><tr><th>올린 날</th><th>서비스</th><th>검사</th><th>상태</th><th></th></tr>` +
      d.items.map(r =>
        `<tr><td>${esc(r.ts.slice(0,16).replace("T"," "))}</td>` +
        `<td><b>${esc(r.title || r.service_id)}</b><br><span class="hint">${esc(r.service_id)}</span></td>` +
        `<td><span class="tag2 s-checked">✓${r.ok_count} △${r.warn_count} ✗${r.bad_count}</span></td>` +
        `<td><span class="tag2 s-${r.status}">${esc(STATUS[r.status] || r.status)}</span>` +
        (r.admin_note ? `<br><span class="hint">${esc(r.admin_note)}</span>` : "") + `</td>` +
        `<td><a href="${api("api/intakes/" + r.id + "/zip")}">받기</a></td></tr>`
      ).join("") + `</table>`;
  }catch(e){}
}

/* ── 서비스 ID 안내 ──────────────────────────────────────────── */
const SID_OK = /^[a-z][a-z0-9-]{1,30}$/;
const HINT_BASE = '영문 소문자로 시작하고 영문·숫자·붙임표만 씁니다. 주소가 됩니다 — <code>/meeting-room/</code>';

function suggestSid(raw){
  let v = (raw || "").trim().toLowerCase();
  v = v.replace(/[\s_.]+/g, "-").replace(/[^a-z0-9-]/g, "")
       .replace(/-{2,}/g, "-").replace(/^-+|-+$/g, "").replace(/^[0-9]+/, "").replace(/^-+/, "");
  return v.slice(0, 31);
}

/* 서버와 **같은 판정, 같은 말**이어야 한다. 화면에서는 되는데 올리면
   안 되는 일이 생기면 그때부터 아무도 화면을 안 믿는다. */
function sidProblem(raw){
  const v = (raw || "").trim();
  if(!v) return "";
  const fix = suggestSid(v);
  const tail = (fix && fix !== v.toLowerCase()) ? ` 「${fix}」 로 쓰시면 됩니다.` : "";
  if(v.includes("_")) return "밑줄(_)은 인터넷 주소에 쓸 수 없습니다. 붙임표(-)로 바꿔 주세요." + tail;
  if(v.includes(" ")) return "띄어쓰기는 주소에 쓸 수 없습니다. 붙임표(-)로 이어 주세요." + tail;
  if(/[가-힣]/.test(v)) return "한글은 주소에 쓸 수 없습니다. 영문으로 적어 주세요." + tail;
  if(v !== v.toLowerCase()) return "대문자는 쓰지 않습니다. 소문자로 적어 주세요." + tail;
  if(/^[0-9]/.test(v)) return "숫자로 시작할 수 없습니다. 영문자로 시작해 주세요." + tail;
  if(v.length < 2) return "두 글자 이상이어야 합니다.";
  if(v.length > 31) return "31글자까지만 쓸 수 있습니다. 더 짧게 줄여 주세요.";
  if(!SID_OK.test(v)) return "영문 소문자·숫자·붙임표만 씁니다." + tail;
  return "";
}

function paintSid(){
  const el = $("#sid"); if(!el) return;
  const why = sidProblem(el.value);
  const hint = $("#sidHint");
  el.classList.toggle("bad", !!why);
  if(!why){ hint.innerHTML = HINT_BASE; return; }
  const fix = suggestSid(el.value);
  hint.innerHTML = `<span class="fixme">${esc(why)}` +
    (fix ? ` <button type="button" id="sidFix">「${esc(fix)}」 로 바꾸기</button>` : "") + `</span>`;
  const b = $("#sidFix");
  if(b) b.onclick = () => { el.value = fix; paintSid(); askSid(); el.focus(); };
}

/* 이미 쓰고 있는 주소인가. 글자 모양이 맞을 때만, 손을 멈춘 뒤에 물어본다.
   **막지 않는다** — 이미 있는 앱을 고쳐 올릴 때는 같은 주소가 정답이다. */
let sidTimer = null, sidSeq = 0;

function askSid(){
  clearTimeout(sidTimer);
  const el = $("#sid"); if(!el) return;
  const raw = el.value.trim();
  if(!raw || sidProblem(raw)) return;
  sidTimer = setTimeout(async () => {
    const seq = ++sidSeq;
    try{
      const d = await (await fetch(apiq("api/service-id/check", {v: raw}))).json();
      if(seq !== sidSeq || el.value.trim() !== raw) return;
      const h = $("#sidHint");
      if(d.kind === "portal"){
        h.innerHTML = `<span class="dupe">⚠ ${esc(d.reason)}<br>고치신 것을 다시 올리는 거라면 이대로 두세요. <b>새 앱이면 다른 주소를 쓰셔야 합니다.</b></span>`;
      } else if(d.kind === "pending"){
        h.innerHTML = `<span class="dupe">⚠ ${esc(d.reason)}<br>같은 앱이면 이대로 두세요. 다른 앱이면 주소를 바꿔 주세요.</span>`;
      } else if(d.kind === "free"){
        h.innerHTML = `<span class="freeok">✓ ${esc(d.reason)}</span>`;
      } else if(d.kind === "unknown"){
        // 확인이 안 됐으면 확인이 안 됐다고 한다. 「비어 있습니다」 라고
        // 말해 놓고 나중에 부딪히는 것이 제일 나쁘다.
        h.innerHTML = `<span class="hint">${esc(d.reason)}</span>`;
      }
    }catch(e){}
  }, 400);
}
