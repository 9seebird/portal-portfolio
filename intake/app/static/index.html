<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>앱 입고 점검</title>
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;--paper:#fff;
      --ok:#15803d;--okbg:#eaf6ee;--warn:#a16207;--warnbg:#fdf6e3;--bad:#b91c1c;--badbg:#fdeceb;--brand:#1f4e79}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.6 "맑은 고딕","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:23px;margin:0 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.drop{border:2px dashed #c7cdd6;border-radius:12px;background:var(--paper);
      padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:#f4f8fc}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.drop span{color:var(--muted);font-size:13px}
button{font:inherit;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.go{background:var(--brand);color:#fff;font-weight:700}
.go:disabled{background:#c3cad3;cursor:not-allowed}
.verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;margin-bottom:18px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.warn{background:var(--warnbg);color:var(--warn)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict b{font-size:17px}
.verdict p{margin:2px 0 0;font-size:13.5px;color:var(--ink);opacity:.75}
.tally{margin-left:auto;font-size:13px;white-space:nowrap;color:var(--ink);opacity:.7}
h2{font-size:14px;margin:20px 0 8px;color:var(--muted);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f5;font-size:14px}
li:last-child{border-bottom:0}
.m{flex:0 0 18px;font-weight:800;text-align:center}
.m.ok{color:var(--ok)} .m.warn{color:var(--warn)} .m.bad{color:var(--bad)} .m.note{color:#9aa3ad}
li.note{color:var(--muted);font-size:13px}
.human{background:#fbfaf6;border:1px solid #ece7d9}
.human li{border-bottom:0;padding:5px 0;align-items:flex-start}
.human .n{flex:0 0 20px;color:var(--brand);font-weight:800}
.err{background:var(--badbg);color:var(--bad);padding:14px 16px;border-radius:10px;font-size:14px}
.file{margin-top:14px;font-size:14px;color:var(--muted)}
.file b{color:var(--ink)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
.hide{display:none}
.sample{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
        background:var(--paper);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;margin-bottom:10px;transition:.15s}
.sample:hover{border-color:var(--brand);background:#f4f8fc}
.sample:last-child{margin-bottom:0}
.sample .tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.sample .tag.ok{background:var(--okbg);color:var(--ok)}
.sample .tag.warn{background:var(--warnbg);color:var(--warn)}
.sample .tag.bad{background:var(--badbg);color:var(--bad)}
.sample b{display:block;font-size:15px;margin-bottom:2px}
.sample span{color:var(--muted);font-size:13px}
.sample:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>
<div class="wrap">
  <h1>앱 입고 점검</h1>
  <p class="lead" id="lead">불러오는 중…</p>

  <div class="card hide" id="samplecard">
    <div id="samples"></div>
  </div>

  <div class="card hide" id="uploadcard">
    <div class="drop" id="drop">
      <b>zip 파일을 여기에 놓거나 눌러서 고르세요</b>
      <span>앱 폴더를 통째로 압축한 것 · 최대 50MB</span>
      <input type="file" id="pick" accept=".zip,application/zip" hidden>
    </div>
    <div class="file hide" id="fileline"></div>
    <div style="margin-top:14px"><button class="go" id="go" disabled>점검하기</button></div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const drop = $("#drop"), pick = $("#pick"), go = $("#go"), out = $("#out"), fileline = $("#fileline");
let chosen = null;

// 주소는 상대경로로 둔다. 포털은 이 앱을 /intake/ 아래에 두는데,
// "/api/check" 로 부르면 포털 최상위로 가서 404 가 난다. (규칙 3)
const api = (p) => new URL(p, location.href).pathname;

// 체험판인지 사내판인지 물어보고 화면을 정한다.
// 화면이 스스로 정하지 않는다 — 서버가 무엇을 받는지가 진실이다.
(async () => {
  let m = { demo:false, samples:[], max_upload_mb:50 };
  try { m = await (await fetch(api("api/mode"))).json(); } catch(e){}
  if (m.demo) {
    $("#lead").innerHTML = `앱을 포털에 붙이기 전에 회사 표준 규칙에 맞는지 확인하는 도구입니다.
      <b>체험판이라 파일을 올릴 수는 없고</b>, 미리 넣어 둔 앱 셋 중에서 골라 결과를 보실 수 있습니다.
      검사하는 코드는 실제와 같습니다.`;
    const marks = ["ok","warn","bad"];
    $("#samples").innerHTML = m.samples.map((s,i) =>
      `<button class="sample" data-id="${esc(s.id)}">
         <span class="tag ${marks[i]||"warn"}">예시 ${i+1}</span>
         <span style="flex:1"><b>${esc(s.label)}</b><span>${esc(s.hint)}</span></span>
       </button>`).join("");
    $("#samplecard").classList.remove("hide");
    document.querySelectorAll(".sample").forEach(b => b.onclick = () => checkSample(b));
  } else {
    $("#lead").innerHTML = `만든 앱을 zip 으로 올리면 회사 표준 규칙에 맞는지 확인해 드립니다.
      <b>✗ 가 하나라도 있으면 포털에 붙일 수 없습니다.</b> 고쳐서 다시 올려 보세요.
      이 화면은 파일을 저장하지 않습니다.`;
    $("#uploadcard").classList.remove("hide");
  }
})();

async function checkSample(btn){
  document.querySelectorAll(".sample").forEach(b => b.disabled = true);
  const old = btn.querySelector("b").textContent;
  btn.querySelector("b").textContent = "점검 중…";
  try{
    const r = await fetch(api("api/check/" + encodeURIComponent(btn.dataset.id)), { method:"POST" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "점검에 실패했습니다.");
    show(render(j));
  }catch(e){ show(err(e.message)); }
  btn.querySelector("b").textContent = old;
  document.querySelectorAll(".sample").forEach(b => b.disabled = false);
}

drop.onclick = () => pick.click();
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", ev => choose(ev.dataTransfer.files[0]));
pick.onchange = () => choose(pick.files[0]);

function choose(f){
  if(!f) return;
  if(!f.name.toLowerCase().endsWith(".zip")){ show(err("zip 파일만 올릴 수 있습니다.")); return; }
  chosen = f;
  fileline.innerHTML = `고른 파일 — <b>${esc(f.name)}</b> (${(f.size/1024/1024).toFixed(1)}MB)`;
  fileline.classList.remove("hide");
  go.disabled = false;
  out.innerHTML = "";
}

go.onclick = async () => {
  if(!chosen) return;
  go.disabled = true; go.textContent = "점검 중…";
  const body = new FormData(); body.append("file", chosen);
  try{
    const r = await fetch(api("api/check"), { method:"POST", body });
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "점검에 실패했습니다.");
    show(render(j));
  }catch(e){ show(err(e.message)); }
  go.disabled = false; go.textContent = "점검하기";
};

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = (html) => { out.innerHTML = html; out.scrollIntoView({behavior:"smooth", block:"nearest"}); };
const err  = (m) => `<div class="err">${esc(m)}</div>`;

const VERDICT = {
  ok:   ["켜도 됩니다", "막는 항목이 없습니다. IT 담당자에게 전달하세요."],
  warn: ["켤 수 있습니다", "△ 는 막지는 않지만, 무엇인지 보고 전달하세요."],
  bad:  ["아직 안 됩니다", "✗ 를 먼저 고쳐 주세요. 하나라도 있으면 붙일 수 없습니다."],
};

function render(j){
  const [t, d] = VERDICT[j.verdict];
  const k = j.tally;
  let h = `<div class="verdict ${j.verdict}">
      <div><b>${esc(j.name)} — ${t}</b><p>${d}</p></div>
      <div class="tally">✓ ${k.ok} &nbsp; △ ${k.warn} &nbsp; ✗ ${k.bad}</div>
    </div>`;

  // ✗ 와 △ 를 맨 위로 모은다. 고칠 사람이 찾아 헤매지 않게.
  const todo = [];
  j.sections.forEach(s => s.items.forEach(i => {
    if(i.mark === "bad" || i.mark === "warn") todo.push({...i, where: s.title});
  }));
  if(todo.length){
    h += `<div class="card"><h2 style="margin-top:0">고칠 것</h2><ul>` +
      todo.map(i => `<li><span class="m ${i.mark}">${i.mark==="bad"?"✗":"△"}</span>
        <span>${esc(i.text)}<br><span style="color:#9aa3ad;font-size:12px">${esc(i.where)}</span></span></li>`).join("") +
      `</ul></div>`;
  }

  h += `<div class="card">` + j.sections.map(s =>
      `<h2>${esc(s.title)}</h2><ul>` + s.items.map(i =>
        `<li class="${i.mark==="note"?"note":""}"><span class="m ${i.mark}">${
          {ok:"✓",warn:"△",bad:"✗",note:"·"}[i.mark]}</span><span>${esc(i.text)}</span></li>`
      ).join("") + `</ul>`
    ).join("") + `</div>`;

  h += `<div class="card human"><h2 style="margin-top:0">여기서부터는 사람이 봐야 합니다</h2><ul>` +
    [["숫자를 만드는 앱인가?","원본과 대조할 표본을 같이 주세요. 에러는 티가 나지만 틀린 숫자는 조용합니다."],
     ["제일 큰 실제 파일로 돌려봤나?","5MB 로 시험하고 63MB 에서 멈춘 일이 실제로 있었습니다."],
     ["지우기·되돌리기가 있나?","없으면 잘못 넣은 것이 영영 남습니다."],
     ["남기는 것이 개인정보·재무자료인가?","보관 기간과 지울 사람을 정해야 합니다."],
     ["담당자가 누구인가?","만든 사람과 다를 수 있습니다."]]
    .map(([q,a],n) => `<li><span class="n">${n+1}</span><span><b>${q}</b><br>
      <span style="color:#8b8578;font-size:13px">${a}</span></span></li>`).join("") +
    `</ul></div>`;

  h += `<details><summary>점검 원문 보기</summary><pre>${esc(j.raw)}</pre></details>`;
  return h;
}
</script>
</body>
</html>
