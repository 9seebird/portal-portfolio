# ★ 프로젝트 이름을 못 박는다.
#
#   docker compose 는 이름을 안 적으면 **폴더 이름**으로 프로젝트를 정한다.
#   그런데 이 저장소를 받은 사람이 같은 이름의 폴더로 다른 것을 이미
#   띄워 두었을 수 있다. 그러면 compose 가 남의 컨테이너를 이 프로젝트
#   것으로 보고, `docker compose exec` 가 **엉뚱한 컨테이너 안에서** 돈다.
#   실제로 그 상황을 겪었다 — 체험판 자료를 넣는 명령이 남의 앱 안에서
#   실행됐다. 그때는 파일이 없어서 실패로 끝났지만, 있었으면 남의 데이터에
#   가짜 자료가 들어갔을 것이다.
#
#   컨테이너 이름에 demo- 를 붙이는 것과는 다른 이야기다.
#   그건 이름이 겹치지 않게 하는 것이고, 이건 **누구 것인지**를 정하는 것이다.
name: demo-manual-import

# =====================================================================
# 매뉴얼 가져오기 — PPT 를 올리면 매뉴얼로 바꿔 준다.
#
# **PPT 가 원본이다.** 고칠 일이 생기면 PPT 를 고쳐서 다시 올린다.
# 매뉴얼 화면의 편집 모드로 고친 것은 다음 업로드 때 덮어써진다.
# 두 곳에 같은 내용을 두면 반드시 갈라지기 때문에 한쪽을 원본으로 정했다.
#
# it-guide 의 파일을 직접 고치는 유일한 앱이라 볼륨을 공유한다.
# (다른 앱들은 서로의 파일을 건드리지 않는다 — 여기는 예외이고, 그래서
#  담당자만 쓸 수 있게 접근 범위를 좁게 잡아야 한다)
#
# 처음 한 번만:  docker network create demo-net
# =====================================================================
services:
  manual-import:
    build: .
    container_name: demo-manual-import
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      # ★ it-guide 의 매뉴얼 폴더를 **쓰기 가능**으로 붙인다.
      #   manuals.js 와 images/ 를 여기서 갱신한다.
      - ../it-guide/web/manuals:/manuals
      # 파이썬 코드. 이걸 안 붙이면 코드는 이미지 안에 구워져 있어서
      # 파일을 고쳐도 docker restart 로는 안 바뀐다 (다시 build 해야 한다).
      - ./app:/app/app:ro
    networks:
      - demo-net

networks:
  demo-net:
    external: true
