<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경 — 미르 IT 포탈</title>
<style>
  :root{
    --bg:#ffffff; --side:#f7f7f8; --line:#e8e8ea;
    --tx:#1f2023; --tx2:#6b6d76; --tx3:#9b9da6;
    --accent:#1f4e79; --accent-soft:#eaf1f8;
    --shadow:0 1px 2px rgba(16,17,20,.05), 0 10px 34px rgba(16,17,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1c1f; --side:#151619; --line:#2a2c31;
      --tx:#ececef; --tx2:#a1a3ac; --tx3:#71737c;
      --accent:#6aa6dd; --accent-soft:#22303e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 34px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;background:var(--side);color:var(--tx);
    font-family:"Pretendard","맑은 고딕","Malgun Gothic",-apple-system,system-ui,sans-serif;
    font-size:15px;
  }
  .box{
    width:min(400px,calc(100vw - 40px));background:var(--bg);
    border:1px solid var(--line);border-radius:16px;padding:32px 30px 26px;box-shadow:var(--shadow);
  }
  .brand{display:block;margin-bottom:22px}
  /* ★ 높이가 아니라 **너비**로 맞춘다.
     로고가 가로로 길어서(10:1) 높이로 맞추면 사이드바(262px) 밖으로 삐져나간다.
     너비로 잡으면 어디에 놓든 폭을 넘지 않는다. */
  .brand .wordmark{width:200px;max-width:100%;height:auto;margin:0 0 18px}
  .brand > div{padding:0;border:0;border-top:1px solid var(--line);padding-top:16px}
  .logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;
        display:grid;place-items:center;font-size:12px;font-weight:700}

  .brand b{font-size:15.5px;font-weight:650;display:block}
  .brand span{font-size:12px;color:var(--tx3)}
  .notice{
    padding:11px 13px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    font-size:13px;line-height:1.6;margin-bottom:20px;display:none;
  }
  .notice.on{display:block}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin:0 0 6px}
  input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--tx);font:inherit;font-size:14px;outline:none;transition:.15s;
  }
  input:focus{border-color:var(--accent)}
  .field{margin-bottom:14px}
  .rule{margin-top:6px;font-size:11.5px;color:var(--tx3)}
  button{
    width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  button:hover{opacity:.9}
  button:disabled{background:var(--line);color:var(--tx3);cursor:default}
  .msg{margin-top:13px;padding:10px 12px;border-radius:9px;font-size:13px;display:none}
  .msg.on{display:block}
  .msg.err{background:#fbe4e4;color:#9c2020}
  .msg.ok{background:#e2f0e2;color:#1e5b2e}
  @media (prefers-color-scheme: dark){
    .msg.err{background:#3a1f1f;color:#e58b8b} .msg.ok{background:#1d3324;color:#87c99a}
  }
  .skip{display:block;margin-top:16px;text-align:center;font-size:12.5px;color:var(--tx3);text-decoration:none}
  .skip:hover{color:var(--accent)}

  /* ── 회사 워드마크 ──────────────────────────────────────────
     밝은 배경용(짙은 글자)과 어두운 배경용(흰 글자) 두 장을 두고
     화면 모드에 따라 바꾼다. 한 장을 filter 로 반전하면 회색이 뭉개진다. */
  .wordmark{width:auto;display:block}
  .wordmark.on-dark{display:none}
  @media (prefers-color-scheme: dark){
    .wordmark.on-light{display:none}
    .wordmark.on-dark{display:block}
  }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <img class="wordmark on-light" alt="MIR" src="/static/wordmark-light.png"><img class="wordmark on-dark" alt="MIR" src="/static/wordmark-dark.png">
    <div><b>비밀번호 변경</b><span id="who"></span></div>
  </div>

  <div class="notice" id="notice">
    초기 비밀번호를 사용 중입니다. 본인만 아는 비밀번호로 변경해 주세요.
  </div>

  <form id="f">
    <div class="field">
      <label for="cur">현재 비밀번호</label>
      <input id="cur" type="password" autocomplete="current-password" autofocus>
    </div>
    <div class="field">
      <label for="n1">새 비밀번호</label>
      <input id="n1" type="password" autocomplete="new-password">
      <div class="rule">8자 이상. 영문·숫자·기호를 섞으면 더 안전합니다.</div>
    </div>
    <div class="field">
      <label for="n2">새 비밀번호 확인</label>
      <input id="n2" type="password" autocomplete="new-password">
    </div>
    <button id="btn" type="submit">변경하기</button>
  </form>

  <div class="msg" id="msg"></div>
  <a class="skip" id="skip" href="/">나중에 하기</a>
</div>

<script>
const KEY = "portal.jwt";
let TOKEN = localStorage.getItem(KEY) || "";
if(!TOKEN) location.replace("/login");

const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

function show(kind, text){ msg.className = "msg on " + kind; msg.textContent = text; }

// 초기 비밀번호 사용 중이면 안내를 띄우고 건너뛰기를 막는다
try{
  const p = JSON.parse(atob(TOKEN.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
  document.getElementById("who").textContent = (p.name || "") + " (" + p.sub + ")";
  if(p.chg){
    document.getElementById("notice").classList.add("on");
    document.getElementById("skip").style.display = "none";
  }
}catch(e){}

document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault();
  msg.classList.remove("on");
  const current = document.getElementById("cur").value;
  const n1 = document.getElementById("n1").value;
  const n2 = document.getElementById("n2").value;

  if(!current || !n1){ show("err","모든 항목을 입력하세요."); return; }
  if(n1 !== n2){ show("err","새 비밀번호가 서로 다릅니다."); return; }
  if(n1.length < 8){ show("err","비밀번호는 8자 이상이어야 합니다."); return; }

  btn.disabled = true;
  try{
    const r = await fetch("/api/me/password", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:"Bearer "+TOKEN },
      body: JSON.stringify({ current, new: n1 })
    });
    if(r.status === 401){ localStorage.removeItem(KEY); location.replace("/login"); return; }
    const j = await r.json();
    if(!r.ok){ show("err", j.detail || "변경에 실패했습니다."); return; }

    if(j.token) localStorage.setItem(KEY, j.token);   // 새 토큰으로 교체
    show("ok","변경했습니다. 잠시 후 포털로 이동합니다.");
    setTimeout(()=>location.replace("/"), 1200);
  }catch(e){
    show("err","서버에 연결하지 못했습니다.");
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
