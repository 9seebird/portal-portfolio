# =====================================================================
# 사내 포털 리버스 프록시
#
# 직원은 포트 번호를 모른 채 한 주소만 쓴다.
# 앱이 늘면 아래 "앱 추가하는 법"을 그대로 복사해서 붙인다.
#
#   /            → portal   (챗 화면·관리자 화면·인증)
#   /ai-report/  → aireport
#   /앱이름/     → 컨테이너
# =====================================================================

# 업스트림을 변수가 아닌 이름으로 두면, 해당 컨테이너가 내려가 있을 때
# nginx 자체가 뜨지 않는다. resolver 를 써서 요청 시점에 찾도록 한다.
# 대신 변수를 쓰면 경로 자동 절삭이 사라지므로 rewrite 를 함께 써야 한다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 업로드 파일 크기. 각 앱의 MAX_UPLOAD_MB 보다 넉넉하게.
    #
    # 20m 이던 것을 150m 로 올렸다. 큰 엑셀 때문이다 —
    # 6월 마감본이 63MB 라, 챗에 붙이면 20m 에서 413 으로 튕겼다.
    # 앱마다 더 필요하면 그 앱의 conf 에서 다시 키운다
    # (앱에 따라 300m 까지 둔다). 여기 값은 그보다 작아도 되지만,
    # **챗에 붙이는 파일은 여기를 지나므로** 챗에서 다룰 가장 큰 파일보다 커야 한다.
    client_max_body_size 150m;

    # ── 챗 포털 (메인) ───────────────────────────────────────
    location / {
        set $portal_upstream http://demo-portal:8080;
        proxy_pass $portal_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 클라이언트가 직접 넣은 X-Forwarded-For 를 덮어쓴다.
        # 그대로 두면 접속 IP 를 위조할 수 있고, 포털의 IP 제한이 무의미해진다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗 응답은 SSE(text/event-stream) 로 조금씩 내려온다.
        # 버퍼링을 켜 두면 다 끝난 뒤 한 번에 나와서 진행 표시가 무의미해진다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        # 화면(HTML/JS)을 캐시하면 배포해도 직원 브라우저에는 옛 화면이 남는다.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # =================================================================
    # 앱 추가하는 법
    #
    # 아래 두 블록을 복사해 ai-report 를 새 앱 이름으로 바꾸면 된다.
    #   (1) location /앱이름/          직원이 들어오는 문
    #   (2) location = /_authz_앱이름  nginx 가 포털에 권한을 묻는 자리
    #
    # service= 값은 포털 관리자 화면의 **서비스 ID** 와 같아야 한다.
    # =================================================================

    # ── AI 사용량 리포트 ─────────────────────────────────────
    location /ai-report/ {
        # (1) 먼저 포털에 "이 사람이 이걸 써도 되나"를 묻는다.
        #     401/403 이면 여기서 끝나고 앱까지 요청이 가지 않는다.
        auth_request /_authz_ai-report;

        # (2) 포털이 응답 헤더로 돌려준 사용자 정보를 받아 둔다.
        auth_request_set $u_id   $upstream_http_x_user_id;
        auth_request_set $u_name $upstream_http_x_user_name;
        auth_request_set $u_dept $upstream_http_x_user_dept;
        auth_request_set $u_role $upstream_http_x_user_role;

        set $aireport_upstream http://demo-aireport:8080;
        # proxy_pass 에 변수를 쓰면 nginx 가 경로 앞부분을 잘라 주지 않는다.
        # 그대로 두면 /ai-report/api/files 가 전부 / 로 뭉개져서
        # API 요청에 대시보드 HTML 이 돌아온다. rewrite 로 직접 잘라 준다.
        rewrite ^/ai-report/?(.*)$ /$1 break;
        proxy_pass $aireport_upstream;

        # (3) 앱에는 이 헤더만 넘어간다. 앱은 이것만 읽으면 된다.
        #     이름·부서는 한글이라 퍼센트 인코딩되어 있다 (unquote 필요).
        proxy_set_header X-User-Id   $u_id;
        proxy_set_header X-User-Name $u_name;
        proxy_set_header X-User-Dept $u_dept;
        proxy_set_header X-User-Role $u_role;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ai-report;

        # /api/file/2026_07.xlsx 같은 주소는 "그 달의 최신 파일"이라는 뜻이지
        # 고정된 파일이 아니다. 캐시를 막지 않으면 옛 파일로 화면을 그린다.
        add_header Cache-Control "no-store, must-revalidate" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /_authz_ai-report {
        internal;                       # 브라우저가 직접 부를 수 없다
        set $authz_aireport http://demo-portal:8080/api/authz?service=ai-report;
        proxy_pass $authz_aireport;
        proxy_pass_request_body off;    # 본문은 필요 없다
        proxy_set_header Content-Length "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI  $request_uri;
    }

    # ── 앞으로 추가할 서비스 (복사해서 이름만 바꾸면 된다) ───
    # location /assets/ {
    #     auth_request /_authz_assets;
    #     auth_request_set $u_id   $upstream_http_x_user_id;
    #     auth_request_set $u_name $upstream_http_x_user_name;
    #     auth_request_set $u_dept $upstream_http_x_user_dept;
    #     auth_request_set $u_role $upstream_http_x_user_role;
    #
    #     set $assets_upstream http://assets:8080;     # set 이 rewrite 보다 먼저
    #     rewrite ^/assets/?(.*)$ /$1 break;
    #     proxy_pass $assets_upstream;
    #
    #     proxy_set_header X-User-Id   $u_id;
    #     proxy_set_header X-User-Name $u_name;
    #     proxy_set_header X-User-Dept $u_dept;
    #     proxy_set_header X-User-Role $u_role;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Prefix /assets;
    #     add_header Cache-Control "no-store, must-revalidate" always;
    # }
    #
    # location = /_authz_assets {
    #     internal;
    #     set $authz_assets http://demo-portal:8080/api/authz?service=assets;
    #     proxy_pass $authz_assets;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header Host            $host;
    #     proxy_set_header X-Real-IP       $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Original-URI  $request_uri;
    # }

    # 권한이 없을 때 나가는 화면. 앱마다 따로 만들지 않아도 된다.
    error_page 401 = @login;
    error_page 403 = @denied;

    location @login {
        return 302 /login;
    }
    location @denied {
        default_type text/html;
        return 403 '<!doctype html><html lang="ko"><meta charset="utf-8"><title>접근 권한 없음</title><body style="margin:0;display:grid;place-items:center;height:100vh;font-family:system-ui,sans-serif;background:#f5f6f8;color:#1f2023"><div style="text-align:center"><div style="font-size:17px;font-weight:650;margin-bottom:8px">이 서비스를 이용할 권한이 없습니다</div><div style="font-size:13px;color:#8a8e97;margin-bottom:20px">필요하시면 IT 담당자에게 문의해주세요.</div><a href="/" style="display:inline-block;padding:9px 18px;border-radius:9px;background:#132033;color:#fff;text-decoration:none;font-size:13.5px">포탈로 돌아가기</a></div></body></html>';
    }
}

# ── 도메인과 인증서가 준비되면 443 블록을 추가한다 ──────────
# HTTPS 로 전환하면 포털 .env 에 COOKIE_SECURE=1 을 넣을 것.
