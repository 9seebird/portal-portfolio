# 서버의 /etc/nginx/snippets/portal-common.conf 와 같은 내용입니다.
# (사본입니다. 이 파일을 고치려면 서버에서 **sudo** 가 필요합니다)
#
# main.conf 의 server 블록 셋에서 각각 include 합니다.
# 새 서비스 추가는 여기가 아니라 /srv/portal/nginx/ 에 conf 를 만듭니다.
# (다만 지금은 앱별 경로를 안쪽 proxy 컨테이너가 가르므로, 새 앱을 붙일 때
#  호스트를 건드릴 일이 없습니다 — README.md 참고)

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 여기는 문지기가 아니라 통로다. 실제 제한은 안쪽 proxy/apps/*.conf 에서 건다.
# 크게 한 번만 잡아 두면, 앱이 늘어도 여기를 다시 건드릴 일이 없다.
client_max_body_size 500m;

# 63MB 를 올리는 데 사내망에서 1분 넘게 걸릴 수 있다. 기본 60초로는 모자란다.
client_body_timeout 600s;

# ── 접속 차단용 내부 창구 ──
location = /_portal_auth {
    internal;
    proxy_pass http://localhost:8080/api/authz;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── 개별 서비스 conf 자동 포함 ──
include /srv/portal/nginx/*.conf;
