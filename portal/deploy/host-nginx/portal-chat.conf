# 서버의 /srv/portal/nginx/portal-chat.conf 와 같은 내용입니다.
# (사본입니다. 서버가 이 파일을 읽지는 않습니다 — README.md 를 보세요)
#
# 이 파일은 portal 소유라 **sudo 없이** 고칠 수 있습니다.
# 고친 뒤 반영만 sudo 입니다:  sudo nginx -t && sudo systemctl reload nginx

location / {
    proxy_pass http://127.0.0.1:8081;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 챗 답변이 한 글자씩 내려온다. 버퍼링하면 다 끝난 뒤 한꺼번에 나온다.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    # 여기서 크기를 잡지 않는다. 공통(snippets/portal-common.conf 500m)을 그대로 쓰고,
    # 실제 제한은 안쪽 proxy/apps/*.conf 에서 앱마다 건다.
    #
    # ★ 여기에 client_max_body_size 를 적으면 공통 값을 **이깁니다.**
    #   2026-08-12 에 여기 20m 가 남아 있어서 63MB 엑셀이 413 으로 막혔습니다.
}
