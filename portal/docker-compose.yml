# ★ 프로젝트 이름을 못 박는다.
#
#   docker compose 는 이름을 안 적으면 **폴더 이름**으로 프로젝트를 정한다.
#   그런데 이 저장소를 받은 사람이 같은 이름의 폴더로 다른 것을 이미
#   띄워 두었을 수 있다. 그러면 compose 가 남의 컨테이너를 이 프로젝트
#   것으로 보고, `docker compose exec` 가 **엉뚱한 컨테이너 안에서** 돈다.
#   실제로 그 상황을 겪었다 — 체험판 자료를 넣는 명령이 남의 앱 안에서
#   실행됐다. 그때는 파일이 없어서 실패로 끝났지만, 있었으면 남의 데이터에
#   가짜 자료가 들어갔을 것이다.
#
#   컨테이너 이름에 demo- 를 붙이는 것과는 다른 이야기다.
#   그건 이름이 겹치지 않게 하는 것이고, 이건 **누구 것인지**를 정하는 것이다.
name: demo-portal

# =====================================================================
# 챗 포털 (메인). 서버 8080 → 컨테이너 8080.
#
# 서비스마다 폴더와 레포를 따로 두고, 각자 자기 compose 로 뜬다.
# 하나의 큰 compose 로 묶으면 앱 하나 고칠 때마다 전부 재시작하게 되고,
# 레포가 각자 있는 지금 방식과도 맞지 않는다.
# 대신 모두 같은 도커 네트워크(demo-net)에 붙어 서로 이름으로 부른다.
#
#   /srv/portal/
#     ├── portal/       ← 이 폴더
#     ├── ai-report/
#     ├── assets/
#     └── proxy/        ← nginx. 하나의 주소로 묶는다
#
# 처음 한 번만:
#     docker network create demo-net
# =====================================================================
services:
  portal:
    build: .
    container_name: demo-portal
    # nginx 를 거치므로 호스트 포트를 열지 않아도 된다.
    # 프록시 없이 직접 붙어 확인할 때만 아래 주석을 푼다.
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      # 계정·서비스·대화 기록. 이 폴더가 사라지면 계정이 전부 사라진다.
      # 백업 대상은 여기 하나뿐이다.
      #
      # 다른 앱의 데이터는 붙이지 않는다. 포털은 앱의 파일을 직접 읽지 않고
      # 그 앱의 API 에 물어본다. 같은 계산이 두 벌이 되면 숫자가 어긋난다.
      - ./data:/app/data
      # 화면 파일(chat.html · admin.html · login.html).
      #
      # 이걸 붙이지 않으면 화면을 한 글자 고칠 때마다 이미지를 다시 빌드해야
      # 하고, 안 하면 컨테이너 안에는 옛 파일이 그대로 남는다. 그 상태로
      # 브라우저에서 Ctrl+Shift+R 을 아무리 눌러도 바뀌지 않는다 —
      # 캐시가 아니라 서버가 옛 파일을 주고 있는 것이기 때문이다.
      #
      # 붙여 두면 파일을 고치고 새로고침만 하면 된다. 읽기 전용(ro)이라
      # 컨테이너가 이 파일들을 바꿀 수는 없다.
      - ./static:/app/static:ro
      # 파이썬 코드.
      #
      # 이걸 안 붙이면 코드는 **이미지 안에 구워져** 있다. 그래서 파일을
      # 고치고 `docker restart portal` 을 해도 아무것도 안 바뀐다.
      # 컨테이너는 여전히 구워질 때의 옛 코드를 읽고 있기 때문이다.
      # 그 상태가 제일 헷갈린다 — 파일은 분명히 고쳐져 있는데 화면만 그대로다.
      #
      # 붙여 두면 static 과 똑같아진다. 고치고 restart 하면 끝이다.
      # (uvicorn 이 --reload 없이 도니까 restart 는 필요하다)
      # 읽기 전용(ro)이라 컨테이너가 코드를 바꿀 수는 없다.
      - ./app:/app/app:ro
    networks:
      - demo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  demo-net:
    external: true
