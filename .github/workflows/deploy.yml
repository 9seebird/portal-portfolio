# =====================================================================
# 밀어 넣으면 검사한다. **배포는 하지 않는다.**
#
#   main 에 푸시  →  검사 4가지
#
# ── 왜 여기서 배포하지 않나 ─────────────────────────────────
# 배포는 서버가 스스로 한다. portal 계정의 타이머가 몇 분에 한 번
# /srv/portal/autodeploy.sh 를 부르고, 그 스크립트가 새 커밋이 있으면
# 받아서 띄운다 (헬스체크가 실패하면 직전 커밋으로 되돌린다).
#
# 예전에는 이 파일에 SSH 로 서버에 들어가 배포하는 job 이 있었다. 지웠다.
#   · 배포 경로가 두 개가 되어, 어느 쪽이 올렸는지 알 수 없었다
#   · 서버 접속 열쇠를 깃허브에 맡겨야 했다 —
#     autodeploy.sh 가 웹훅 대신 「물어보기」를 고른 이유와 정면으로 어긋난다
#   · 열쇠(Secrets)를 넣지 않은 채로 두면 푸시할 때마다 실패 메일이 온다
#
# ★ job 이름(검사/배포)을 한글로 적었더니 워크플로가 아예 시작되지 않았다.
#   깃허브의 job ID 는 **영문·숫자·- ·_ 만** 된다. 화면에 뜨는 이름은
#   name: 으로 따로 주면 되고, 거기에는 한글을 써도 된다.
#   증상이 고약했다 — 문법 오류가 아니라 「실행된 작업이 없습니다」로
#   끝나고, 실패 메일만 계속 왔다.
# =====================================================================
name: 검사

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 깃허브 화면에서 손으로 돌릴 때

concurrency:
  # 연달아 푸시하면 앞 검사는 취소한다. 마지막 것만 보면 된다.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 문법 — 셸
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 bash -n
          echo "✓ 셸 스크립트 문법 정상"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 문법 — 파이썬
        run: |
          python -m compileall -q backend 2>/dev/null || true
          python -m compileall -q $(git ls-files '*.py' | xargs -r -n1 dirname | sort -u) \
            && echo "✓ 파이썬 문법 정상"

      - name: 문법 — 자바스크립트
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '\.min\.js$'); do node --check "$f"; done
          echo "✓ 자바스크립트 문법 정상"

      - name: 사내 정보 유출 검사
        env:
          # 실명·실제 도메인·실제 IP 대역. 저장소 Settings > Secrets 에 넣는다.
          # 여기 직접 적으면 그 목록 자체가 공개된다.
          SECRET_WORDS: ${{ secrets.SECRET_WORDS }}
        run: |
          if [ -n "$SECRET_WORDS" ]; then
            printf '%s\n' "$SECRET_WORDS" > /tmp/.secretwords
            export SECRET_WORDS_FILE=/tmp/.secretwords
          fi
          bash tools/check_secrets.sh

      # ⚠ 지금은 결과를 막지 않는다 (continue-on-error).
      #
      # 자체 로그인을 없애고 인증을 포털로 옮기면서 /auth/login 이 사라졌는데,
      # tests/conftest.py 의 admin 픽스처가 아직 그 주소로 로그인을 시도한다.
      # 그래서 거의 모든 테스트가 404 로 무너진다 — 코드가 틀린 게 아니라
      # 테스트가 옛 구조를 보고 있는 것이다.
      #
      # 픽스처를 헤더 방식으로 고치면 이 줄을 지우고 막게 바꾼다.
      # 그때까지는 「돌긴 돈다」는 것만 보고 막지는 않는다.
      - name: 백엔드 테스트 (it-asset)
        continue-on-error: true
        working-directory: it-asset/backend
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          pytest -q || true
          echo "※ 테스트 픽스처가 옛 로그인 구조를 보고 있어 아직 막지 않습니다."
