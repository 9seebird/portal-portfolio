# =====================================================================
# 밀어 넣으면 검사하고, 통과하면 배포한다.
#
#   main 에 푸시  →  검사 5가지  →  (통과하면) 서버에 배포
#   PR            →  검사만
#
# ── 배포 job 을 뺐다가 다시 넣은 이야기 ────────────────────
# 한 번 지웠던 job 이다. 그때 이유는 「서버 접속 열쇠를 깃허브에 맡겨야
# 한다」였고, 대신 서버가 5분마다 물어보는 방식(autodeploy.timer)을 뒀다.
#
# 다시 넣은 이유는 그 걱정을 **제대로 없앨 수 있다는 것을 알았기 때문**이다.
# 배포 전용 열쇠에 강제 명령을 걸면, 그 열쇠로는 셸을 얻을 수 없다.
#
#   command="/srv/portal/autodeploy.sh --force",no-pty,no-port-forwarding,...
#
# 붙는 순간 배포 스크립트만 돌고 끊긴다. 열쇠가 새어도 남이 할 수 있는 것은
# 「배포를 한 번 더 돌리는 것」뿐이다. 파일을 읽지도, 명령을 바꾸지도 못한다.
# 설치 방법은 deploy/github-actions/README.md 에 있다.
#
# 그리고 SSH 는 어차피 이미 열려 있었다 — 회사에서도 집에서도 들어간다.
# 「문을 하나 더 연다」가 애초에 사실이 아니었다.
#
# 배포 자체는 서버의 autodeploy.sh 가 한다. 이 파일은 그것을 부르기만 한다.
# 그래서 헬스체크와 되돌리기가 그대로 살아 있다 — 띄운 뒤 /health 가
# 대답하지 않으면 서버가 스스로 직전 커밋으로 돌아간다.
#
# ★ job ID(check/deploy)를 한글로 적었더니 워크플로가 아예 시작되지 않았다.
#   깃허브의 job ID 는 **영문·숫자·- ·_ 만** 된다. 화면에 뜨는 이름은
#   name: 으로 따로 주면 되고, 거기에는 한글을 써도 된다.
#   증상이 고약했다 — 문법 오류가 아니라 「실행된 작업이 없습니다」로
#   끝나고, 실패 메일만 계속 왔다.
# =====================================================================
name: 검사와 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 깃허브 화면에서 손으로 돌릴 때

concurrency:
  # 연달아 푸시하면 앞 검사는 취소한다. 마지막 것만 보면 된다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 문법 — 셸
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 bash -n
          echo "✓ 셸 스크립트 문법 정상"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 문법 — 파이썬
        run: |
          python -m compileall -q backend 2>/dev/null || true
          python -m compileall -q $(git ls-files '*.py' | xargs -r -n1 dirname | sort -u) \
            && echo "✓ 파이썬 문법 정상"

      - name: 문법 — 자바스크립트
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '\.min\.js$'); do node --check "$f"; done
          echo "✓ 자바스크립트 문법 정상"

      - name: 회사 이름이 한 이름으로 맞는가
        run: |
          # 체험판 회사 이름은 tools/company.py 한 곳에만 있다.
          # 옛 이름을 품은 코드 조각을 붙여 넣으면 여기서 걸린다.
          python tools/company.py --check

      - name: 사내 정보 유출 검사
        env:
          # ★ SECRET_WORDS 는 **넣지 않는 쪽을 골랐다.**
          #
          #   그 목록에는 실제 직원 이름이 들어 있다. 깃허브 Secrets 에 넣으면
          #   CI 도 실명을 검사해 주지만, 목록이 있는 곳이 한 군데 늘어난다.
          #
          #   대신 push 앞에 세웠다 — .githooks/pre-push 가 내 PC 에서 먼저
          #   검사하고, 걸리면 push 자체를 취소한다. 깃허브에 도달하지 않으므로
          #   히스토리에 남을 일도 없다. 한 번 올라간 것을 지우는 쪽이 훨씬 번거롭다.
          #
          #   여기서는 값이 비어 있어 실명 검사만 「건너뜀」으로 찍히고,
          #   나머지 세 검사(파일·열쇠·사설IP)는 그대로 돈다.
          #   나중에 마음이 바뀌면 Secrets 에 SECRET_WORDS 를 넣기만 하면 된다.
          SECRET_WORDS: ${{ secrets.SECRET_WORDS }}
        run: |
          if [ -n "$SECRET_WORDS" ]; then
            printf '%s\n' "$SECRET_WORDS" > /tmp/.secretwords
            export SECRET_WORDS_FILE=/tmp/.secretwords
          fi
          bash tools/check_secrets.sh

      # ★ 이제 실패하면 막는다.
      #
      # 한동안 continue-on-error 로 열어 두었다. 인증을 포털로 옮기면서
      # /auth/login 이 사라졌는데 tests/conftest.py 의 admin 픽스처가 아직
      # 그 주소로 로그인을 시도해, 거의 모든 테스트가 404 로 무너져 있었기
      # 때문이다 — 코드가 틀린 게 아니라 테스트가 옛 구조를 보고 있었다.
      #
      # 픽스처를 포털 헤더 방식으로 고쳐 165개가 전부 통과한다.
      # 늘 빨간 검사는 아무도 안 본다. 통과하게 만들었으면 막아야 뜻이 있다.
      - name: 백엔드 테스트 (it-asset)
        working-directory: it-asset/backend
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          pytest -q

  # ── 배포 ─────────────────────────────────────────────────
  #
  # 검사가 통과해야만 돈다(needs). PR 에서는 돌지 않는다 —
  # 남의 브랜치가 서버에 닿으면 안 된다.
  deploy:
    name: 배포
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # 연달아 푸시해도 배포는 겹치지 않게 한 줄로 세운다.
    # cancel-in-progress 는 false — 배포 중간에 끊으면 반쯤 뜬 상태가 남는다.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: 비밀값이 다 있는지 먼저 본다
        env:
          KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KH:   ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # 없는 채로 ssh 를 부르면 "Permission denied" 같은 엉뚱한 오류가 나서
          # 원인을 찾는 데 한참 걸린다. 여기서 이름을 대고 멈춘다.
          miss=""
          [ -n "$KEY"  ] || miss="$miss DEPLOY_SSH_KEY"
          [ -n "$HOST" ] || miss="$miss DEPLOY_HOST"
          [ -n "$USER" ] || miss="$miss DEPLOY_USER"
          [ -n "$KH"   ] || miss="$miss DEPLOY_KNOWN_HOSTS"
          if [ -n "$miss" ]; then
            echo "✗ 저장소 Secrets 에 다음이 없습니다:$miss"
            echo "  넣는 방법: deploy/github-actions/README.md"
            exit 1
          fi
          echo "✓ 비밀값 4개 확인"

      - name: 열쇠 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KH:  ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # ★ 비밀값을 run: 안에 ${{ }} 로 직접 박지 않는다.
          #   따옴표를 품은 값이 들어오면 셸 명령이 되어 버린다.
          #   env 로 받아 변수로만 쓴다.
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 서버의 지문을 미리 넣어 둔다. 이게 없으면 StrictHostKeyChecking 이
          # 물어보다가 멈추고, 끄면 중간에서 가로채는 서버에 그대로 붙는다.
          printf '%s\n' "$KH" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 서버에 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # 명령을 적지 않는다. 서버의 authorized_keys 에 강제 명령이 걸려 있어
          # 무엇을 보내든 autodeploy.sh --force 만 돈다.
          # 배포가 실패하면 그 종료 코드가 그대로 넘어와 이 job 이 빨개진다.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -p "${PORT:-22}" \
              "$USER@$HOST"

      - name: 열쇠 지우기
        if: always()
        run: rm -f ~/.ssh/id_deploy
