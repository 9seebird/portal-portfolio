# IT 자산 포탈 — 앱 안쪽 nginx (deploy/nginx.conf)
#
# 예전과 달라진 곳은 한 줄이다.
#   proxy_pass http://api:8000/;         →  http://demo-asset-api:8000/
#
# 이유: 이제 이 컨테이너들이 demo-net 이라는 **공용 네트워크**에 붙는다.
# 거기에는 다른 앱의 컨테이너도 같이 있다. compose 의 서비스 이름 api 는
# 흔한 이름이라, 다른 앱이 자기 서비스를 api 라고 지으면 어느 쪽으로
# 갈지 알 수 없게 된다. container_name 은 도커 전체에서 유일하므로
# 그걸 쓴다.
#
# 이 파일은 포털 nginx 가 /it-asset 을 떼고 넘겨준 뒤에 동작한다.
#   브라우저 /it-asset/api/assets/  →  여기서는 /api/assets/  →  asset-api /assets/
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # /api/auth/me -> (백엔드) /auth/me  : 끝의 / 가 /api 접두사를 벗긴다
    location /api/ {
        proxy_pass http://demo-asset-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 포털이 붙여 준 사용자 정보를 백엔드까지 그대로 전달한다.
        # 이 네 줄이 없으면 백엔드는 헤더를 못 받아 전부 401 이 된다.
        proxy_set_header X-User-Id   $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Dept $http_x_user_dept;
        proxy_set_header X-User-Role $http_x_user_role;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 화면을 캐시하면 고쳐서 올려도 직원 브라우저에는 옛 화면이 남는다.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
