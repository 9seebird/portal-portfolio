# ★ 프로젝트 이름을 못 박는다.
#
#   docker compose 는 이름을 안 적으면 **폴더 이름**으로 프로젝트를 정한다.
#   그런데 이 저장소를 받은 사람이 같은 이름의 폴더로 다른 것을 이미
#   띄워 두었을 수 있다. 그러면 compose 가 남의 컨테이너를 이 프로젝트
#   것으로 보고, `docker compose exec` 가 **엉뚱한 컨테이너 안에서** 돈다.
#   실제로 그 상황을 겪었다 — 체험판 자료를 넣는 명령이 남의 앱 안에서
#   실행됐다. 그때는 파일이 없어서 실패로 끝났지만, 있었으면 남의 데이터에
#   가짜 자료가 들어갔을 것이다.
#
#   컨테이너 이름에 demo- 를 붙이는 것과는 다른 이야기다.
#   그건 이름이 겹치지 않게 하는 것이고, 이건 **누구 것인지**를 정하는 것이다.
name: demo-biz-plan

# =====================================================================
# 사업계획 예상손익 (biz-plan)
#
# 재무팀이 쓰던 「사업계획용 예상손익 자료작성.html」을 사내 포털에 붙인 것이다.
# 화면과 계산 결과는 원본 그대로다. 달라진 것은 계산하는 자리뿐이다.
#
#   원본 : 브라우저가 인터넷(cdn.jsdelivr.net, pypi.org)에서 파이썬을
#          받아 와서 계산 — 사내망에서 막히면 첫 화면에서 멈췄다
#   지금 : 이 컨테이너가 계산 — 바깥 인터넷을 안 탄다
#
# 파일은 저장하지 않는다. 받아서 메모리에서 처리하고 버린다.
# 그래서 data 볼륨도 없다. 남는 것은 포털로 보내는 실행 이력뿐이다.
#
# 처음 한 번만:  docker network create demo-net
# =====================================================================
services:
  biz-plan:
    build: .
    container_name: demo-biz-plan
    restart: unless-stopped
    env_file:
      - .env
    # ports 는 쓰지 않는다. 앞단 nginx 가 /biz-plan/ 경로로 넘겨준다.
    expose:
      - "8080"
    volumes:
      # 코드와 화면을 붙여 둔다. 포털과 같은 방식이다.
      #
      # 안 붙이면 코드가 **이미지 안에 구워져** 있다. 그래서 파일을 고치고
      # `docker restart` 를 해도 아무것도 안 바뀐다 — 컨테이너는 구워질 때의
      # 옛 코드를 읽고 있기 때문이다. 그 상태가 제일 헷갈린다. 파일은 분명히
      # 고쳐져 있는데 화면만 그대로다.
      #
      # 붙여 두면 고치고 restart 하면 끝이다 (uvicorn 이 --reload 없이 도니까
      # restart 는 필요하다). 읽기 전용이라 컨테이너가 코드를 바꿀 수는 없다.
      - ./app:/app/app:ro
    networks:
      - demo-net
    # 예시 파일 기준 계산이 0.4초, 엑셀 만들기가 1.4초다. 가벼운 편이라
    # 크게 먹지 않는다. 그래도 상한은 둔다 — 잘못된 파일 하나가 서버 전체를
    # 마비시키는 일을 막는다.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  demo-net:
    external: true
