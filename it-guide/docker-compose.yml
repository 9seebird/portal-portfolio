# ★ 프로젝트 이름을 못 박는다.
#
#   docker compose 는 이름을 안 적으면 **폴더 이름**으로 프로젝트를 정한다.
#   그런데 이 저장소를 받은 사람이 같은 이름의 폴더로 다른 것을 이미
#   띄워 두었을 수 있다. 그러면 compose 가 남의 컨테이너를 이 프로젝트
#   것으로 보고, `docker compose exec` 가 **엉뚱한 컨테이너 안에서** 돈다.
#   실제로 그 상황을 겪었다 — 체험판 자료를 넣는 명령이 남의 앱 안에서
#   실행됐다. 그때는 파일이 없어서 실패로 끝났지만, 있었으면 남의 데이터에
#   가짜 자료가 들어갔을 것이다.
#
#   컨테이너 이름에 demo- 를 붙이는 것과는 다른 이야기다.
#   그건 이름이 겹치지 않게 하는 것이고, 이건 **누구 것인지**를 정하는 것이다.
name: demo-it-guide

# =====================================================================
# IT 안내 — 매뉴얼 · 운영 체크리스트 · ITO 비용 체크리스트
#
# 옛 포털(it-portal/portal-web)에 있던 정적 화면을 그대로 옮겨 왔다.
# 백엔드가 없다. nginx 하나가 파일을 주는 것이 전부다.
#
# **컨테이너는 하나인데 서비스는 넷이다.**
# 포털의 권한은 서비스 단위로 걸린다. 매뉴얼은 전 직원이 봐도 되지만
# 운영 체크리스트는 IT 담당자만 봐야 할 수도 있다. 그래서 프록시에서
# 경로를 셋으로 나누고 각각 따로 권한을 묻는다 (proxy/apps/*.conf).
# 정적 파일 셋 때문에 컨테이너를 셋 띄울 이유는 없다.
#
#   /manual/     → /manuals/    (11개 매뉴얼, 이미지 17MB)
#   /checklist/  → /checklist/  (수시·매일·월간·분기·연간 59항목)
#   /ito-cost/   → /ito-cost/   (ITO 비용처리)
#   /prompt/     → /prompt/     (바이브코딩 프롬프트 생성기)
#
# 내용을 고치는 법은 web/manuals/README.txt 에 있다.
# 요약하면 — 화면에서 편집 모드로 고치고, 저장을 누르면 파일이
# 다운로드되고, 그 파일을 이 폴더에 덮어쓴다. 볼륨으로 붙여 두었으므로
# **덮어쓰고 새로고침만 하면 반영된다.** 이미지를 다시 만들 필요가 없다.
#
# 처음 한 번만:  docker network create demo-net
# =====================================================================
services:
  guide:
    image: nginx:1.27-alpine
    container_name: demo-guide-web
    restart: unless-stopped
    # 포털 프록시를 거치므로 호스트 포트를 열지 않는다.
    # 열어 두면 권한 검사를 건너뛰고 바로 들어올 수 있다.
    expose:
      - "80"
    volumes:
      # 읽기 전용이 아니다 — 편집한 manuals.js 를 덮어쓸 수 있어야 한다.
      # 컨테이너가 스스로 쓰는 일은 없다 (nginx 는 파일을 주기만 한다).
      - ./web:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - demo-net
    healthcheck:
      # localhost 가 아니라 127.0.0.1 이다.
      # 컨테이너 안에서 localhost 는 ::1(IPv6) 로 먼저 풀리는데,
      # 이 nginx 는 `listen 80;` 만 있어서 IPv4 로만 듣는다. 그래서
      # 검사가 계속 실패하고 컨테이너가 unhealthy 로 남는다.
      # (옛 포털의 itportal-web 이 5시간째 unhealthy 인 것도 같은 이유다)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── 포털에 자기를 등록한다 (표준 규칙 22) ────────────────────
  #
  # 다른 앱들은 자기 코드 안에서 뜰 때 포털에 등록을 보낸다. 그런데 이 앱은
  # **백엔드가 없다.** nginx 가 파일을 주는 것이 전부라 보낼 코드가 없다.
  # 규칙이 미처 다루지 않은 경우다.
  #
  # 그래서 한 번 뛰고 끝나는 작은 컨테이너를 둔다. 세 서비스를 등록하고
  # 스스로 멈춘다. `docker ps` 에는 안 남는다 (`docker ps -a` 로 보인다).
  #
  # 등록해도 **꺼진 상태로** 들어간다 (enabled=false, 접근 범위 없음).
  # 관리자가 범위를 정하고 켜야 직원에게 보인다. 앱이 스스로 켤 수는 없다.
  register:
    image: curlimages/curl:8.11.1
    container_name: demo-guide-register
    restart: "no"
    depends_on:
      guide:
        condition: service_healthy
    environment:
      TOKEN: ${AUDIT_TOKEN:?it-guide/.env 에 AUDIT_TOKEN 이 없습니다. setup 을 먼저 돌리세요}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        PORTAL=http://demo-portal:8080

        # 포털이 아직 뜨는 중일 수 있다. 잠깐 기다린다.
        i=0
        until curl -sf "$$PORTAL/health" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then
            echo "포털에 연결하지 못했습니다 ($$PORTAL). 등록을 건너뜁니다."
            echo "portal 컨테이너가 떠 있는지 확인하고 다시 실행하세요."
            exit 0     # 등록 실패로 배포 전체를 실패로 만들지 않는다
          fi
          sleep 2
        done

        reg() {
          code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "$$PORTAL/api/services/register" \
            -H "X-Service-Token: $$TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$$1")
          if [ "$$code" = "200" ]; then
            echo "  OK  $$2"
          else
            echo "  실패 $$2  (HTTP $$code) $$(cat /tmp/out)"
            [ "$$code" = "403" ] && echo "      AUDIT_TOKEN 이 포털 것과 다릅니다. setup 을 다시 돌리세요."
          fi
        }

        echo "포털에 서비스 등록"
        reg '{"id":"manual","name":"IT 매뉴얼","url":"/manual/","color":"#1f4e79",
              "description":"SAP·NAS·그룹웨어·M365 등 업무 시스템 사용법을 한곳에서 봅니다.",
              "keywords":"매뉴얼,사용법,설치,절차,가이드,SAP,NAS,그룹웨어,M365,카스퍼스키,Grafana,웍스AI"}' "IT 매뉴얼"

        reg '{"id":"checklist","name":"IT 운영 체크리스트","url":"/checklist/","color":"#1baf7a",
              "description":"수시·매일·월간·분기·연간으로 나눈 IT 운영 업무와 유지보수 업체 정보입니다.",
              "keywords":"체크리스트,점검,운영,유지보수,업체,월간,분기,연간,인수인계"}' "IT 운영 체크리스트"

        reg '{"id":"ito-cost","name":"ITO 비용처리","url":"/ito-cost/","color":"#eda100",
              "description":"ITO 비용 정산 항목을 확인하고 정리합니다.",
              "keywords":"ITO,비용,정산,청구,상해"}' "ITO 비용처리"

        reg '{"id":"prompt","name":"바이브코딩 프롬프트 생성기","url":"/prompt/","color":"#2f6fed",
              "description":"웍스AI 로 사내 프로그램을 만들 때 쓰는 프롬프트를 빈칸만 채워 만들어 줍니다. 회사 표준 규칙이 들어 있습니다.",
              "keywords":"바이브코딩,프롬프트,프롬프트 생성기,예시,샘플,문장,웍스AI,코딩,AI,만들기,개발,표준규칙,템플릿"}' "바이브코딩 프롬프트 생성기"

        reg '{"id":"rules","name":"사내앱 규칙 한눈에","url":"/rules/","color":"#4F7566",
              "description":"사내에서 쓸 웹 프로그램을 만들 때 정해져 있는 규칙 42가지를 묶음별로 봅니다. 대부분은 프롬프트 생성기가 자동으로 넣어 줍니다.",
              "keywords":"규칙,표준,사내앱,만들기,체크,반려,제출,바이브코딩,표준규칙,권한,포트,저장"}' "사내앱 규칙 한눈에"

        reg '{"id":"ai-ref","name":"AI 참고자료","url":"/ai-ref/","color":"#B85042",
              "description":"AI 용어 192개, 바로 복사해 쓰는 프롬프트 216개, 바이브코딩 입문 70항목을 한 곳에서 검색합니다.",
              "keywords":"용어,용어집,프롬프트,프롬프트집,예시,바이브코딩,입문,AI,모르는말,검색,사전"}' "AI 참고자료"

        echo "끝. 관리자 화면 > 서비스 관리 에서 접근 범위를 정하고 켜 주세요."
    networks:
      - demo-net

networks:
  demo-net:
    external: true
