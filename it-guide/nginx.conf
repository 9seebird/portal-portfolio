# 정적 파일만 준다. 옛 포털의 nginx.conf 에서 자산관리 관련 부분만 뺐다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 매뉴얼 이미지가 17MB 다. 압축과 캐시가 체감 차이를 만든다.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 이미지는 파일명이 그대로면 내용도 그대로다. 길게 캐시한다.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 내용 파일은 고치면 바로 보여야 한다. 캐시하지 않는다.
    # (편집 모드로 고치고 덮어썼는데 옛 내용이 보이면 고장난 줄 안다)
    location ~* /(manuals/data/manuals\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 화면 파일도 캐시하지 않는다.
    #
    # 이 앱은 볼륨으로 붙어 있어서 파일만 덮어쓰면 바로 반영되는 것이 장점인데,
    # 브라우저가 index.html 을 쥐고 있으면 그 장점이 사라진다. 실제로 화면을
    # 고치고 "그대로인데?" 하는 일이 있었다. Ctrl+F5 를 눌러야만 보이는 것은
    # 고쳐진 것이 아니다.
    #
    # 체크리스트·ITO비용·프롬프트는 데이터까지 index.html 안에 들어 있어서
    # 더더욱 그렇다.
    location ~* /(manuals|checklist|ito-cost|prompt|rules|ai-ref)/(index\.html)?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
