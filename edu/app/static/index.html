<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인 교육</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1c2024; --muted:#6b7480;
    --brand:#2563eb; --ok:#0f9d58; --warn:#c2410c; --bar:#eceff3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       font-size:15px;line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
         display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .who{margin-left:auto;color:var(--muted);font-size:13px}
  header a.admin{font-size:13px;color:var(--brand);text-decoration:none;border:1px solid var(--line);
                 padding:5px 10px;border-radius:6px}
  main{max-width:920px;margin:0 auto;padding:20px}
  .course{background:var(--card);border:1px solid var(--line);border-radius:10px;
          padding:18px 20px;margin-bottom:18px}
  .course h2{font-size:18px;margin:0 0 6px}
  .desc{color:var(--muted);font-size:14px;margin:0 0 12px;white-space:pre-wrap}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bar);color:var(--muted)}
  .badge.due{background:#fff2e8;color:var(--warn);font-weight:700}
  .badge.done{background:#e7f6ed;color:var(--ok);font-weight:700}
  .badge.over{background:#fdeaea;color:#c02626;font-weight:700}
  .bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
  .bar.ok > i{background:var(--ok)}
  ul.lessons{list-style:none;margin:14px 0 0;padding:0}
  li.lesson{border-top:1px solid var(--line);padding:12px 0}
  .row{display:flex;align-items:center;gap:12px;cursor:pointer}
  .row .n{width:26px;height:26px;border-radius:50%;background:var(--bar);color:var(--muted);
          display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .row .n.ok{background:var(--ok);color:#fff}
  .row .t{flex:1;min-width:0}
  .row .t b{font-weight:600;display:block}
  .row .t small{color:var(--muted);font-size:12.5px}
  .row .pct{font-size:13px;color:var(--muted);flex:none;min-width:42px;text-align:right}
  .panel{margin:12px 0 4px 38px}
  .panel .player{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
  .panel .player > div, .panel .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .panel .doc{width:100%;height:520px;border:1px solid var(--line);border-radius:8px}
  .panel .bar{margin-top:10px}
  .panel .hint{color:var(--muted);font-size:12.5px;margin-top:8px}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;
         padding:8px 14px;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:default}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;
         padding:40px 20px;text-align:center;color:var(--muted)}
  .err{background:#fdeaea;color:#a01e1e;border:1px solid #f3c6c6;border-radius:8px;
       padding:12px 14px;margin-bottom:16px;font-size:14px}

  /* ── 화면 안에서 뜨는 창 ──────────────────────────────────
     브라우저 기본 prompt·confirm 은 주소가 그대로 보이고 생김새를 맞출 수 없다.
     같은 자리에서 같은 모양으로 뜨게 직접 만든다. */
  .modal-back{position:fixed;inset:0;background:rgba(20,24,28,.45);display:flex;
              align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-box{background:var(--card);border-radius:12px;max-width:440px;width:100%;
             padding:22px 24px;box-shadow:0 14px 44px rgba(0,0,0,.2)}
  .modal-box h3{margin:0 0 6px;font-size:17px}
  .modal-box p.msub{margin:0 0 4px;color:var(--muted);font-size:13.5px;white-space:pre-line}
  .modal-box label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px}
  .modal-box input,.modal-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;
             padding:10px 12px;font:inherit;background:#fff}
  .modal-box input:focus,.modal-box textarea:focus{outline:2px solid #c7d7fb;border-color:var(--brand)}
  .modal-box textarea{min-height:64px;resize:vertical}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
  .modal-foot button{padding:9px 16px}
  button.primary.danger{background:#c02626;border-color:#c02626;color:#fff}
</style>
</head>
<body>
<header>
  <h1>온라인 교육</h1>
  <span class="who" id="who"></span>
  <a class="admin" id="adminLink" href="admin" style="display:none">담당자 화면</a>
  <a class="admin" id="pwLink" href="#" style="display:none">비밀번호 변경</a>
  <a class="admin" id="logoutLink" href="#" style="display:none">로그아웃</a>
</header>
<main>
  <div id="err" class="err" style="display:none"></div>
  <div id="okmsg" class="err" style="display:none;background:#e7f6ed;color:#0b6b3d;border-color:#bfe4cd"></div>

  <div id="list"></div>
</main>

<script>
// ── 이 앱은 포털 아래 /edu/ 로 붙는다. API 는 반드시 상대경로로 부른다. ────────
const CFG = { pingInterval: 5, bucketSec: 10 };
let ME = null, COURSES = [], openLesson = null, player = null, timer = null;
let lastPos = {};          // 차시별로 직전에 보고한 위치. 건너뛰기 판별에 쓴다.
let ytReady = false, ytQueue = null;

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  if (r.status === 401) {
    // 단독 모드면 로그인 화면으로. 포털 뒤에 있으면 포털이 알아서 처리한다.
    location.href = 'login';
    throw new Error('로그인이 필요합니다.');
  }
  if (!r.ok) {
    let msg = r.status + ' 오류';
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
function showErr(m) { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }
function showOk(m) {
  const e = document.getElementById('okmsg');
  e.textContent = m; e.style.display = 'block';
  setTimeout(() => { e.style.display = 'none'; }, 4000);
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtClock(sec) {
  sec = Math.floor(sec || 0);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function resumeNote(l) {
  const from = l.completed ? 0 : (l.resumeSec || 0);
  return from ? `<b>${fmtClock(from)}</b> 부터 이어서 재생합니다. ` : '';
}
function fmtDur(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + '분' + (s ? ' ' + s + '초' : '');
}


// ── 화면 안에서 뜨는 창 ─────────────────────────────────────────────────────
// modal({...}) 은 [확인] 을 누르면 입력값 묶음을, [취소]·Esc·바깥 클릭이면 null 을 준다.
function modal(opt) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">
        <h3>${opt.title || ''}</h3>
        ${opt.sub ? `<p class="msub">${opt.sub}</p>` : ''}
        ${opt.html || ''}
        <div class="modal-foot">
          <button type="button" data-x="cancel">${opt.cancelText || '취소'}</button>
          <button type="button" class="primary${opt.danger ? ' danger' : ''}" data-x="ok">${opt.okText || '확인'}</button>
        </div>
      </div>`;
    document.body.appendChild(back);

    const collect = () => {
      const o = {};
      back.querySelectorAll('[data-field]').forEach(el => {
        o[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
      });
      return o;
    };
    const close = v => { document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(null); }
      // 한 줄짜리 입력칸에서 엔터를 치면 확인으로 본다. 여러 줄 칸은 그냥 줄바꿈.
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); close(collect()); }
    };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => { if (e.target === back) close(null); });
    back.querySelector('[data-x="cancel"]').onclick = () => close(null);
    back.querySelector('[data-x="ok"]').onclick = () => close(collect());

    const first = back.querySelector('[data-field]');
    (first || back.querySelector('[data-x="ok"]')).focus();
    if (first && first.select) first.select();
  });
}

// 예/아니오만 묻는 창. true 면 진행한다.
function confirmBox(title, sub, okText, danger) {
  return modal({ title, sub, okText: okText || '확인', danger: danger !== false })
    .then(v => v !== null);
}

// ── 유튜브 IFrame API ────────────────────────────────────────────────────────
// 영상을 서버가 직접 내보내지 않는 대신, 재생 위치를 이 API 로 읽어 진도를 잰다.
window.onYouTubeIframeAPIReady = function () {
  ytReady = true;
  if (ytQueue) { const q = ytQueue; ytQueue = null; mountPlayer(q); }
};
(function loadYT() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => showErr('유튜브를 불러오지 못했습니다. 사내망에서 youtube.com 접속이 막혀 있는지 확인해 주세요.');
  document.head.appendChild(s);
})();

function mountPlayer(lesson) {
  if (!ytReady) { ytQueue = lesson; return; }
  const host = document.getElementById('yt-' + lesson.id);
  if (!host) return;
  // 지난번에 보던 자리에서 이어 튼다. 진도를 재고 있으면서 처음부터 틀 이유가 없다.
  const from = lesson.completed ? 0 : (lesson.resumeSec || 0);
  // 건너뛴 구간을 '본 것'으로 세면 안 되므로 직전 위치를 그 자리로 맞춰 둔다.
  lastPos[lesson.id] = from;
  player = new YT.Player(host, {
    videoId: lesson.youtubeId,
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1, start: from },
    events: {
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) startTicking(lesson);
        else { stopTicking(); if (e.data === YT.PlayerState.ENDED) tick(lesson); }
      }
    }
  });
}
function startTicking(lesson) { stopTicking(); timer = setInterval(() => tick(lesson), CFG.pingInterval * 1000); }
function stopTicking() { if (timer) { clearInterval(timer); timer = null; } }

async function tick(lesson) {
  if (!player || !player.getCurrentTime) return;
  const pos = player.getCurrentTime(), dur = player.getDuration();
  if (!dur) return;
  const prev = lastPos[lesson.id];
  lastPos[lesson.id] = pos;
  try {
    const r = await api('api/progress', {
      method: 'POST',
      body: JSON.stringify({ lessonId: lesson.id, position: pos, duration: Math.round(dur),
                             prev: (prev === undefined ? pos : prev) })
    });
    applyProgress(lesson.id, r);
  } catch (e) { /* 잠깐 끊긴 것일 수 있다. 다음 주기에 다시 보낸다 */ }
}

function applyProgress(lessonId, r) {
  for (const c of COURSES) {
    const l = c.lessons.find(x => x.id === lessonId);
    if (!l) continue;
    l.coveredSec = r.coveredSec != null ? r.coveredSec : l.coveredSec;
    l.percent = r.ratio != null ? Math.round(r.ratio * 100) : l.percent;
    if (r.completed) l.completed = true;
    const req = c.lessons.filter(x => x.required);
    c.doneRequired = req.filter(x => x.completed).length;
    c.totalRequired = req.length;
    c.completed = req.length > 0 && c.doneRequired === req.length;
  }
  paintProgress(lessonId);
}

// 화면 전체를 다시 그리면 재생 중인 영상이 끊긴다. 숫자만 바꿔 끼운다.
function courseWatchPercent(c) {
  const req = c.lessons.filter(x => x.required);
  if (!req.length) return 0;
  const seen = req.reduce((a, x) => a + (x.completed ? 1 : Math.min(1, (x.percent || 0) / 100)), 0);
  return Math.round(seen / req.length * 100);
}

function paintProgress(lessonId) {
  for (const c of COURSES) {
    const l = c.lessons.find(x => x.id === lessonId);
    if (!l) continue;
    const pct = document.getElementById('pct-' + l.id);
    if (pct) pct.textContent = l.completed ? '완료' : l.percent + '%';
    const n = document.getElementById('n-' + l.id);
    if (n && l.completed) { n.classList.add('ok'); n.textContent = '✓'; }
    const bar = document.getElementById('lbar-' + l.id);
    if (bar) { bar.style.width = Math.min(100, l.percent) + '%'; }
    const cb = document.getElementById('cbar-' + c.id);
    if (cb) {
      cb.style.width = courseWatchPercent(c) + '%';
      cb.parentElement.classList.toggle('ok', c.completed);
    }
    const cm = document.getElementById('cmeta-' + c.id);
    if (cm) cm.textContent = c.doneRequired + ' / ' + c.totalRequired + ' 차시 완료'
      + (c.completed ? '' : ` · 전체 ${courseWatchPercent(c)}% 시청`);
    const cd = document.getElementById('cdone-' + c.id);
    if (cd) cd.style.display = c.completed ? '' : 'none';
  }
}

function dueBadge(c) {
  if (c.daysLeft === null || c.daysLeft === undefined) return '';
  if (c.completed) return '';
  if (c.daysLeft < 0) return '<span class="badge over">기한 지남 (' + c.deadline + ')</span>';
  if (c.daysLeft === 0) return '<span class="badge due">오늘 마감</span>';
  return '<span class="badge due">D-' + c.daysLeft + ' · ' + c.deadline + '까지</span>';
}

function render() {
  const box = document.getElementById('list');
  if (!COURSES.length) {
    box.innerHTML = '<div class="empty">지금 지정된 교육이 없습니다.</div>';
    return;
  }
  box.innerHTML = COURSES.map(c => {
    const pct = courseWatchPercent(c);
    return `
    <section class="course">
      <h2>${esc(c.title)}</h2>
      ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ''}
      <div class="meta">
        ${dueBadge(c)}
        <span class="badge done" id="cdone-${c.id}" style="${c.completed ? '' : 'display:none'}">이수 완료</span>
        <span class="badge" id="cmeta-${c.id}">${c.doneRequired} / ${c.totalRequired} 차시 완료${
          c.completed ? '' : ` · 전체 ${pct}% 시청`}</span>
      </div>
      <div class="bar ${c.completed ? 'ok' : ''}"><i id="cbar-${c.id}" style="width:${pct}%"></i></div>
      <ul class="lessons">
        ${c.lessons.map((l, i) => lessonHtml(l, i)).join('')}
      </ul>
    </section>`;
  }).join('');

  box.querySelectorAll('.row').forEach(el => {
    el.addEventListener('click', () => toggle(parseInt(el.dataset.id, 10)));
  });
}

function lessonHtml(l, i) {
  const kindLabel = { youtube: '영상', doc: '자료', link: '링크' }[l.kind] || '';
  const sub = [kindLabel, l.required ? '' : '선택', l.durationSec ? fmtDur(l.durationSec) : '', l.note || '']
    .filter(Boolean).join(' · ');
  return `
    <li class="lesson">
      <div class="row" data-id="${l.id}">
        <span class="n ${l.completed ? 'ok' : ''}" id="n-${l.id}">${l.completed ? '✓' : i + 1}</span>
        <span class="t"><b>${esc(l.title)}</b><small>${esc(sub)}</small></span>
        <span class="pct" id="pct-${l.id}">${l.completed ? '완료' : l.percent + '%'}</span>
      </div>
      <div class="panel" id="panel-${l.id}" style="display:none"></div>
    </li>`;
}

function toggle(id) {
  const panel = document.getElementById('panel-' + id);
  if (openLesson === id) { closePanel(); return; }
  closePanel();
  openLesson = id;

  let lesson = null;
  for (const c of COURSES) { const f = c.lessons.find(x => x.id === id); if (f) lesson = f; }
  if (!lesson) return;

  if (lesson.kind === 'youtube') {
    panel.innerHTML = `
      <div class="player"><div id="yt-${id}"></div></div>
      <div class="bar"><i id="lbar-${id}" style="width:${Math.min(100, lesson.percent)}%"></i></div>
      <p class="hint">${resumeNote(lesson)}실제로 재생된 구간만 진도로 쌓입니다. 이 강의는 ${Math.round((lesson.minRatio || 0.9) * 100)}% 이상 보면 자동으로 이수 처리됩니다.</p>`;
    panel.style.display = '';
    mountPlayer(lesson);
  } else if (lesson.kind === 'doc') {
    panel.innerHTML = `
      <iframe class="doc" src="${esc(lesson.url)}"></iframe>
      <p class="hint">
        <button class="primary" id="done-${id}" ${lesson.completed ? 'disabled' : ''}>
          ${lesson.completed ? '열람 완료됨' : '다 봤습니다'}
        </button>
        <a href="${esc(lesson.url)}" target="_blank" rel="noopener" style="margin-left:8px">새 창으로 열기</a>
      </p>`;
    panel.style.display = '';
    const btn = document.getElementById('done-' + id);
    if (btn) btn.addEventListener('click', () => markDone(id, btn));
  } else {
    panel.innerHTML = `
      <p class="hint">
        <a class="primary" href="${esc(lesson.url)}" target="_blank" rel="noopener">
          <button class="primary">새 창에서 열기</button></a>
        <button id="done-${id}" ${lesson.completed ? 'disabled' : ''} style="margin-left:8px">
          ${lesson.completed ? '열람 완료됨' : '다 봤습니다'}
        </button>
      </p>`;
    panel.style.display = '';
    const btn = document.getElementById('done-' + id);
    if (btn) btn.addEventListener('click', () => markDone(id, btn));
  }
}

function closePanel() {
  stopTicking();
  if (player && player.destroy) { try { player.destroy(); } catch (e) {} }
  player = null;
  if (openLesson) {
    const p = document.getElementById('panel-' + openLesson);
    if (p) { p.style.display = 'none'; p.innerHTML = ''; }
  }
  openLesson = null;
}

async function markDone(id, btn) {
  btn.disabled = true;
  try {
    await api('api/lessons/' + id + '/done', { method: 'POST' });
    applyProgress(id, { completed: true, ratio: 1 });
    btn.textContent = '열람 완료됨';
  } catch (e) { btn.disabled = false; showErr(e.message); }
}

(async function init() {
  try {
    ME = await api('api/me');
    document.getElementById('who').textContent = `${ME.name} (${ME.dept})`;
    if (ME.role === 'admin') document.getElementById('adminLink').style.display = '';
    Object.assign(CFG, await api('api/config'));
    if (CFG.standalone) {
      const lo = document.getElementById('logoutLink');
      lo.style.display = '';
      lo.addEventListener('click', async ev => {
        ev.preventDefault();
        await fetch('api/logout', { method: 'POST' });
        location.href = 'login';
      });

      const pl = document.getElementById('pwLink');
      pl.style.display = '';
      pl.addEventListener('click', async ev => {
        ev.preventDefault();
        const rule = CFG.passwordMinLen > 1
          ? `새 비밀번호는 ${CFG.passwordMinLen}자 이상이어야 합니다.`
          : '길이 제한은 없습니다. 처음 비밀번호를 그대로 쓰셔도 됩니다.';
        const v = await modal({
          title: '비밀번호 변경', sub: rule, okText: '바꾸기',
          html: `<label>지금 비밀번호</label>
                 <input data-field="current" type="password" autocomplete="current-password">
                 <label>새 비밀번호</label>
                 <input data-field="next" type="password" autocomplete="new-password">`,
        });
        if (!v) return;
        try {
          await api('api/me/password', { method: 'POST',
            body: JSON.stringify({ current: v.current, next: v.next }) });
          showOk('비밀번호를 바꿨습니다.');
        } catch (e2) { showErr(e2.message); }
      });
    }
    COURSES = (await api('api/courses')).courses;
    render();
  } catch (e) { showErr(e.message); }
})();
